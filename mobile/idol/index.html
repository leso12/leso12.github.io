<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>아이돌 시뮬레이터 로딩</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#faf8ff;color:#433b68}
    body{display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    main{text-align:center;padding:28px;max-width:420px}
    .spin{font-size:38px;animation:p 1s infinite alternate}
    @keyframes p{to{transform:scale(1.15)}}
    b{display:block;font-size:22px;line-height:1.4;margin-top:8px}
    small{display:block;margin-top:12px;color:#8179a5;font-size:16px;line-height:1.5;word-break:keep-all}
    #retry{display:none;margin:20px auto 0;border:0;border-radius:14px;background:#eee8ff;color:#5a43a8;font-weight:700;font-size:16px;min-height:48px;padding:0 20px}
  </style>
</head>
<body>
<main>
  <div class="spin">🎤</div>
  <b>아이돌 시뮬레이터를 불러오는 중…</b>
  <small id="s">모바일 v20.1 · 로더 준비 중</small>
  <button id="retry" type="button">다시 불러오기</button>
</main>
<script>
(()=>{
  const FILES=['part001.txt','part002.txt','part003.txt','part004.txt','part005.txt','part006.txt','part007.txt','part008.txt'];
  const status=document.getElementById('s');
  const retry=document.getElementById('retry');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  function urlFor(file,attempt=0){
    const u=new URL(file,location.href);
    u.searchParams.set('v','20.1');
    u.searchParams.set('_',String(Date.now()+attempt));
    return u.href;
  }

  function xhrText(file,attempt=0){
    return new Promise((resolve,reject)=>{
      const x=new XMLHttpRequest();
      x.open('GET',urlFor(file,attempt),true);
      x.timeout=15000;
      x.setRequestHeader('Cache-Control','no-cache');
      x.onload=()=>{
        if(x.status>=200&&x.status<300&&x.responseText) resolve(x.responseText);
        else reject(new Error(file+' HTTP '+x.status));
      };
      x.onerror=()=>reject(new Error(file+' 네트워크 오류'));
      x.ontimeout=()=>reject(new Error(file+' 시간 초과'));
      x.send();
    });
  }

  function iframeText(file,attempt=0){
    return new Promise((resolve,reject)=>{
      const f=document.createElement('iframe');
      f.setAttribute('aria-hidden','true');
      f.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px;border:0';
      let done=false;
      const finish=(ok,value)=>{
        if(done)return; done=true; clearTimeout(timer); f.remove(); ok?resolve(value):reject(value);
      };
      const timer=setTimeout(()=>finish(false,new Error(file+' 보조 로딩 시간 초과')),15000);
      f.onload=()=>{
        try{
          const doc=f.contentDocument;
          const text=(doc&&doc.body&&(doc.body.innerText||doc.body.textContent)||'').trim();
          if(!text)throw new Error(file+' 빈 응답');
          finish(true,text);
        }catch(e){finish(false,e)}
      };
      f.onerror=()=>finish(false,new Error(file+' 보조 로딩 실패'));
      f.src=urlFor(file,attempt);
      document.body.appendChild(f);
    });
  }

  async function loadPart(file,index){
    let last;
    for(let attempt=0;attempt<3;attempt++){
      status.textContent=`모바일 v20.1 · ${index+1}/${FILES.length} 불러오는 중`;
      try{return await xhrText(file,attempt)}catch(e){last=e}
      await sleep(250*(attempt+1));
    }
    try{
      status.textContent=`모바일 v20.1 · ${index+1}/${FILES.length} 보조 방식으로 불러오는 중`;
      return await iframeText(file,9);
    }catch(e){last=e}
    throw last||new Error(file+' 로딩 실패');
  }

  async function boot(){
    retry.style.display='none';
    status.textContent='모바일 v20.1 · 연결 확인 중';
    try{
      let b='';
      for(let i=0;i<FILES.length;i++) b+=(await loadPart(FILES[i],i)).replace(/\s+/g,'');
      status.textContent='모바일 v20.1 · 게임 화면 여는 중';
      const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
      if(!('DecompressionStream' in window)) throw new Error('현재 브라우저가 압축 해제를 지원하지 않아요. Chrome 또는 Samsung Internet 최신 버전에서 열어주세요.');
      const ds=new DecompressionStream('gzip');
      const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
      if(!html.includes('<html')&&!html.includes('<!doctype')) throw new Error('게임 본체 검증 실패');
      document.open(); document.write(html); document.close();
    }catch(e){
      console.error(e);
      status.textContent='로딩 실패 · '+(e&&e.message?e.message:String(e));
      retry.style.display='block';
    }
  }

  retry.addEventListener('click',boot);
  boot();
})();
</script>
</body>
</html>
