<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>아이돌 시뮬레이터 로딩</title><style>html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#faf8ff;color:#433b68}body{display:grid;place-items:center}main{text-align:center;padding:24px}.spin{font-size:34px;animation:p 1s infinite alternate}@keyframes p{to{transform:scale(1.15)}}small{display:block;margin-top:10px;color:#8179a5}</style></head><body><main><div class="spin">🎤</div><b>아이돌 시뮬레이터를 불러오는 중…</b><small id="s">모바일 v20</small></main><script>(async()=>{try{const files=['part001.txt', 'part002.txt', 'part003.txt', 'part004.txt', 'part005.txt', 'part006.txt', 'part007.txt', 'part008.txt'];let b='';for(const f of files){const r=await fetch(f+'?v=20',{cache:'no-store'});if(!r.ok)throw new Error(f+' HTTP '+r.status);b+=await r.text()}const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome/Samsung Internet을 사용해주세요.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('s').textContent='로딩 실패 · '+e.message;console.error(e)}})();</script></body></html>
