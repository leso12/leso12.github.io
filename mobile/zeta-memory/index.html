<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0c10"><title>ZETA 기억 보강</title><style>:root{color-scheme:dark;--b:#0d0c10;--p:#17151c;--p2:#1e1a25;--l:#332d3d;--t:#f1edf4;--m:#a39aaa;--a:#9a7cff;--ok:#8bd4a5;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);word-break:keep-all;overflow-wrap:break-word}header{position:sticky;top:0;z-index:5;padding:14px 14px calc(11px + env(safe-area-inset-top));background:#0d0c10ee;border-bottom:1px solid var(--l);backdrop-filter:blur(14px)}header small{color:var(--a);font-weight:800}header h1{font-size:20px;margin:3px 0 0}.wrap{max-width:760px;margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}.title{font-weight:850;font-size:14px}.sub{font-size:11px;color:var(--m);line-height:1.55;margin:4px 0 10px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}button,input,select,textarea{font:inherit;color:var(--t);border:1px solid var(--l);background:#100f13;border-radius:11px;min-height:42px}button{padding:9px 11px;font-weight:800;background:#282231}button.primary{background:linear-gradient(180deg,#9478ef,#7456d6);border-color:#9d84ef}input,select,textarea{width:100%;padding:10px 11px}textarea{resize:vertical}.badge{font-size:10px;color:var(--ok)}.tools{display:grid;grid-template-columns:130px 1fr;gap:8px}.mem{background:var(--p2);border:1px solid #393244;border-radius:13px;padding:11px;margin-top:8px;overflow:hidden}.mem.sel{border-color:var(--a)}.mem h3{font-size:13px;margin:0}.meta{font-size:10px;color:#968d9e;margin-top:4px}.preview{font-size:11px;line-height:1.55;color:#c8c0cc;margin:7px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:7px}.actions button{min-height:34px;padding:6px 8px;font-size:10px}.selected pre{white-space:pre-wrap;font:11px/1.65 system-ui;color:#ddd5e2;max-height:230px;overflow:auto;margin:8px 0 0}.empty{text-align:center;color:#81788a;font-size:11px;padding:16px}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2c2537;border:1px solid #4c405c;border-radius:12px;padding:10px 13px;font-size:11px;max-width:90vw;z-index:20}.hide{display:none!important}@media(max-width:520px){.row.stack{flex-direction:column;align-items:stretch}.tools{grid-template-columns:1fr}.actions{flex-wrap:wrap}}</style></head><body><header><small>ZETA Memory Bridge · mobile hotfix</small><h1>기억 보강</h1></header><main class="wrap"><section id="pair" class="card"><div class="title">PC 기억 서재 연결</div><p class="sub">PC 관리 → 모바일 기억 동기화의 연결 코드를 처음 한 번만 붙여넣으세요.</p><textarea id="code" rows="3" placeholder="zgb_...~..."></textarea><button id="connect" class="primary" style="width:100%;margin-top:8px">연결하기</button></section><div id="app" class="hide"><section class="card"><div class="row stack"><div class="grow"><div id="name" class="title">ZETA 기억 서재</div><div id="status" class="sub" style="margin-bottom:0">동기화 준비 중…</div></div><span id="net" class="badge">온라인</span><button id="sync">↻ 동기화</button></div></section><section class="card"><div class="title">현재 장면</div><p class="sub">지금 하려는 말이나 장면 단서를 적으면 관련 기억을 찾습니다.</p><textarea id="scene" rows="4" placeholder="예: 그때도 직접 먹여주셨잖아요…"></textarea><div class="row stack" style="margin-top:8px"><label class="grow sub" style="margin:0">최대 <input id="max" type="number" min="0" max="12" value="2" style="display:inline-block;width:62px;min-height:36px;padding:6px">개</label><button id="recommend" class="primary grow">🧠 관련 기억 찾기</button></div></section><section class="card selected"><div class="row"><div class="title grow">이번 보강 · <span id="sc">0</span>개</div><button id="clear">비우기</button></div><div id="picked"><div class="empty">관련 기억을 찾거나 아래에서 직접 추가하세요.</div></div><div class="row stack" style="margin-top:10px"><button id="copy" class="primary grow">📋 보강 블록 복사</button><button id="openZeta" class="grow">ZETA 열기</button></div></section><section class="card"><div class="row stack"><div class="grow"><div class="title">기억 찾기 · <span id="cnt">0</span>개</div></div><select id="profiles" class="grow"></select></div><div class="tools"><select id="kind"><option value="story_event">본편 사건</option><option value="if_episode">IF 에피소드</option><option value="all">전체</option></select><input id="search" placeholder="제목·내용·인물·대사·미해결 검색…"></div><div id="list"></div></section><section class="card"><button id="disconnect" style="width:100%">연결 해제</button></section></div></main><div id="toast" class="toast hide"></div><script>(()=>{'use strict';const URL='https://vulpttgewjfkxojimyxl.supabase.co',KEY='sb_publishable_Tc7VuwOoq2-rc5aizrurPg_ffzD1nyV',ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1bHB0dGdld2pma3hvamlteXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTYzNjIsImV4cCI6MjEwMTg3MjM2Mn0.6sa3OWO5zH1-t5hhAuSuT5GtAgFVNXzrY7kGGo98qJM',STORE='zgb_mobile_pair_v2',OOC='아래 기억 블록은 과거 사건 참고용임. 내용을 회상문처럼 다시 설명하지 말고 현재 장면의 대사·속마음·행동·관계 반응에 필요한 부분만 자연스럽게 반영할 것.';let pair=null,data={},pid='',timer=null;const sel=new Map(),$=id=>document.getElementById(id),arr=v=>Array.isArray(v)?v.filter(Boolean):v?[v]:[],norm=v=>String(v||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim(),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(s){$('toast').textContent=s;$('toast').classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hide'),2300)}function parse(s){s=String(s||'').trim();const i=s.indexOf('~');if(i<12)return null;const w=s.slice(0,i).trim(),k=s.slice(i+1).trim();return /^zgb_[a-z0-9]{20,}$/i.test(w)&&k.length>20?{workspaceId:w,syncSecret:k}:null}function hdr(){return{apikey:KEY,Authorization:'Bearer '+ANON,'x-zgb-sync-key':pair.syncSecret}}function profiles(){return arr(data.zgbProfiles)}function events(){const m=data.zgbEventRecords||{};return Array.isArray(m[pid])?m[pid]:[]}function prof(){return profiles().find(p=>p.id===pid)||null}function id(e){return String(e.id||e.eventId||e.eventKey||e.title)}function fu(e){return arr(e.followUps).map(x=>typeof x==='string'?x:[x?.title,x?.detail,x?.dueHint].filter(Boolean).join(' ')).join(' ')}function searchText(e){return[e.title,e.text,e.place,e.openThreads,e.outcome,e.lastingEffects,arr(e.people).join(' '),arr(e.relationshipChanges).join(' '),fu(e),arr(e.notableQuotes).map(q=>typeof q==='string'?q:[q?.speaker,q?.quote||q?.text].filter(Boolean).join(' ')).join(' ')].join(' ')}function period(e){const b=arr(e.beats),f=b[0]||{},l=b.at(-1)||{},sd=f.date||e.startDate||e.eventDate||'',ed=l.date||e.resolvedDate||e.lastDate||sd,st=f.time||e.startTime||e.eventTime||'',et=l.time||e.resolvedTime||e.lastTime||st,sp=f.place||e.place||'',ep=l.place||e.place||sp;let w='';if(sd&&ed&&sd!==ed)w=sd+(st?' '+st:'')+'→'+ed+(et?' '+et:'');else if(sd)w=st&&et&&st!==et?sd+' '+st+'→'+et:sd+(st?' '+st:'');else w=st&&et&&st!==et?st+'→'+et:(st||et);const p=sp&&ep&&sp!==ep?sp+'→'+ep:(sp||ep);return[w,p].filter(Boolean).join(' | ')+([w,p].some(Boolean)?' |':'')}function clip(x,n=900){x=String(x||'').replace(/\s+/g,' ').trim();return x.length<=n?x:x.slice(0,n).trim()}function block(e){let body=clip(e.text||e.outcome||e.lastingEffects||'',900),bn=norm(body),qc=0;for(const q of arr(e.notableQuotes)){const t=String(typeof q==='string'?q:(q?.quote||q?.text||'')).replace(/^["'“”]+|["'“”]+$/g,'').trim(),sp=typeof q==='string'?'':String(q?.speaker||'');if(t&&!bn.includes(norm(t).slice(0,35))&&body.length<760){body+=(body?' ':'')+(sp?sp+'은 ':'')+'“'+t+'”라고 말함.';bn=norm(body);if(++qc>=2)break}}const meta=[],rel=arr(e.relationshipChanges).slice(0,2);if(rel.length)meta.push('관계 변화: '+rel.join(' / '));const st=String(e.threadStatus||e.eventStatus||'').toUpperCase();if(e.openThreads&&!['RESOLVED','FAILED','SUPERSEDED'].includes(st))meta.push('미해결: '+clip(e.openThreads,360));const pending=arr(e.followUps).filter(x=>typeof x==='string'||!x||x.status!=='DONE').slice(0,2);if(pending.length)meta.push('후속: '+pending.map(x=>typeof x==='string'?x:(x?.title||x?.detail||'후속 예정')).join(' / '));return['['+(e.title||e.eventKey||'과거 사건')+']',period(e),body,meta.join('\n')].filter(Boolean).join('\n\n')}function renderProfiles(){const ps=profiles(),s=$('profiles');s.innerHTML='';if(!pid||!ps.some(p=>p.id===pid))pid=data.zgbActiveProfileId||ps[0]?.id||'';for(const p of ps){const o=document.createElement('option');o.value=p.id;o.textContent=p.name||'ZETA NPC';o.selected=p.id===pid;s.appendChild(o)}$('name').textContent=prof()?.name||'ZETA 기억 서재'}function visible(){const q=norm($('search').value),k=$('kind').value;return events().filter(e=>(k==='all'||String(e.eventKind||'story_event')===k)&&(!q||norm(searchText(e)).includes(q))).sort((a,b)=>Number(b.pinned||0)-Number(a.pinned||0)||Number(b.importance||0)-Number(a.importance||0))}function renderList(){const list=visible();$('cnt').textContent=list.length;$('list').innerHTML=list.length?'':'<div class="empty">조건에 맞는 기억이 없어요.</div>';for(const e of list.slice(0,120)){const d=document.createElement('div');d.className='mem'+(sel.has(id(e))?' sel':'');d.innerHTML='<h3>'+esc(e.title||'과거 사건')+'</h3><div class="meta">'+esc(period(e)||e.place||'')+'</div><div class="preview">'+esc(e.text||e.outcome||'')+'</div><div class="actions"><button>'+(sel.has(id(e))?'✓ 선택됨':'＋ 보강에 추가')+'</button></div>';d.querySelector('button').onclick=()=>toggle(e);$('list').appendChild(d)}}function renderSel(){$('sc').textContent=sel.size;$('picked').innerHTML=sel.size?'':'<div class="empty">관련 기억을 찾거나 아래에서 직접 추가하세요.</div>';for(const e of sel.values()){const d=document.createElement('div');d.className='mem';d.innerHTML='<div class="row"><h3 class="grow">'+esc(e.title||'과거 사건')+'</h3><button>빼기</button></div><pre>'+esc(block(e))+'</pre>';d.querySelector('button').onclick=()=>toggle(e);$('picked').appendChild(d)}}function toggle(e){const i=id(e),max=Math.max(0,Math.min(12,parseInt($('max').value)||2));if(sel.has(i))sel.delete(i);else{if(sel.size>=max)return toast('최대 '+max+'개까지 선택할 수 있어요.');sel.set(i,e)}renderSel();renderList()}function tokens(x){return[...new Set(norm(x).match(/[가-힣A-Za-z0-9]{2,}/g)||[])].slice(0,30)}function recommend(){sel.clear();const max=Math.max(0,Math.min(12,parseInt($('max').value)||2)),scene=((data.zgbSceneStates||{})[pid]||{}),ts=tokens([$('scene').value,scene.currentIssue,scene.relationshipFlow,scene.summary,scene.location].filter(Boolean).join(' ')),kind=$('kind').value,rank=events().filter(e=>kind==='all'||String(e.eventKind||'story_event')===kind).map(e=>{const t=norm(e.title),b=norm(e.text),o=norm(e.openThreads),f=norm(fu(e)),q=norm(arr(e.notableQuotes).map(x=>typeof x==='string'?x:(x?.quote||x?.text||'')).join(' '));let s=0;for(const k of ts){if(t.includes(k))s+=9;if(o.includes(k))s+=8;if(f.includes(k))s+=8;if(q.includes(k))s+=6;if(b.includes(k))s+=4}if(e.openThreads)s++;if(arr(e.followUps).length)s++;return[e,s]}).sort((a,b)=>b[1]-a[1]);for(const [e,s] of rank){if(sel.size>=max)break;if((ts.length&&s>=4)||(!ts.length&&(e.openThreads||arr(e.followUps).length)))sel.set(id(e),e)}renderSel();renderList();toast(sel.size?'관련 기억 '+sel.size+'개를 골랐어요.':'관련 기억을 찾지 못했어요. 직접 검색해도 돼요.')}async function sync(){if(!pair||!navigator.onLine)return;$('status').textContent='클라우드 최신본 확인 중…';try{const u=URL+'/rest/v1/zgb_sync_blobs?select=bucket,revision,payload,updated_at&workspace_id=eq.'+encodeURIComponent(pair.workspaceId)+'&order=revision.asc',r=await fetch(u,{headers:hdr()});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json(),m={};let last='';for(const x of rows){if(x.payload?.data)Object.assign(m,x.payload.data);if(x.updated_at>last)last=x.updated_at}data=m;renderProfiles();renderList();renderSel();$('status').textContent=rows.length?'자동 동기화 · '+new Date(last||Date.now()).toLocaleString('ko-KR'):'클라우드에 아직 기억이 없어요.';$('net').textContent='온라인'}catch(e){$('status').textContent='동기화 오류 · '+e.message;$('net').textContent='오류'}}async function copy(){if(!sel.size)return toast('먼저 기억을 선택해 주세요.');const text='[OOC]\n'+OOC+'\n\n[기억 보강]\n\n'+[...sel.values()].map(block).join('\n\n');try{await navigator.clipboard.writeText(text);toast('보강 블록 '+sel.size+'개를 복사했어요.')}catch{toast('복사 권한을 확인해 주세요.')}}function start(){try{pair=JSON.parse(localStorage.getItem(STORE)||'null')}catch{}$('pair').classList.toggle('hide',!!pair);$('app').classList.toggle('hide',!pair);if(pair){sync();clearInterval(timer);timer=setInterval(()=>navigator.onLine&&sync(),15000)}}$('connect').onclick=()=>{const p=parse($('code').value);if(!p)return toast('연결 코드 형식을 확인해 주세요.');pair=p;localStorage.setItem(STORE,JSON.stringify(pair));start()};$('disconnect').onclick=()=>{localStorage.removeItem(STORE);pair=null;data={};sel.clear();clearInterval(timer);start()};$('sync').onclick=sync;$('recommend').onclick=recommend;$('clear').onclick=()=>{sel.clear();renderSel();renderList()};$('copy').onclick=copy;$('search').oninput=renderList;$('kind').onchange=()=>{sel.clear();renderSel();renderList()};$('profiles').onchange=function(){pid=this.value;sel.clear();renderList();renderSel();$('name').textContent=prof()?.name||'ZETA 기억 서재'};$('openZeta').onclick=()=>window.open(prof()?.roomUrl||'https://zeta-ai.io/','_blank');addEventListener('online',sync);addEventListener('offline',()=>{$('net').textContent='오프라인'});start()})();</script></body></html>
