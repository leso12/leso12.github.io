<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf5"><title>에르베니아 게임 빌더 v6.22 · Mobile</title><style>html,body{margin:0;min-height:100%;background:#eee8df;color:#453a33;font-family:system-ui,-apple-system,sans-serif}#boot{padding:28px 22px;line-height:1.65;word-break:keep-all}.bar{height:5px;background:#ddd0c0;border-radius:99px;overflow:hidden;margin-top:14px}.bar i{display:block;width:30%;height:100%;background:#74564b;animation:m 1s ease-in-out infinite alternate}@keyframes m{to{transform:translateX(230%)}}</style></head><body><div id="boot"><b>에르베니아 게임 빌더 v6.22</b><br>공통 Core/Schema 기반 모바일 편집기를 여는 중입니다.<div class="bar"><i></i></div></div><script>
(async()=>{try{const mf=await (await fetch('./manifest.json',{cache:'no-store'})).json();const arr=await Promise.all(mf.parts.map(async p=>{const r=await fetch('./'+p,{cache:'no-store'});if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.text()}));const b=arr.join('');const raw=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.querySelector('#boot').innerHTML='<b>모바일 빌더를 열지 못했습니다.</b><br>'+String(e)+'<br><small>새로고침 후에도 계속되면 배포 상태를 확인하세요.</small>';}})();
</script></body></html>
