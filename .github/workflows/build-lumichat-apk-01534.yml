name: Build LumiChat Android APK v0.15.34

on:
  push:
    paths:
      - '.deploy/lumichat-apk-01534-trigger.txt'

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate minimal LumiChat Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lumichat-android"
          mkdir -p "$ROOT/app/src/main/java/io/github/leso12/lumichat" "$ROOT/app/src/main/res/values"
          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='LumiChat'
          include ':app'
          EOF
          cat > "$ROOT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'io.github.leso12.lumichat'
              compileSdk 35
              defaultConfig {
                  applicationId 'io.github.leso12.lumichat'
                  minSdk 26
                  targetSdk 35
                  versionCode 1534
                  versionName '0.15.34'
              }
              buildTypes {
                  debug { minifyEnabled false }
              }
          }
          EOF
          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0C0E</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF
          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="LumiChat"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > "$ROOT/app/src/main/java/io/github/leso12/lumichat/MainActivity.java" <<'EOF'
          package io.github.leso12.lumichat;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String HOME = "https://leso12.github.io/mobile/lumichat/";
              private static final int FILE_CHOOSER = 7341;
              private WebView webView;
              private ProgressBar progress;
              private ValueCallback<Uri[]> fileCallback;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(11,12,14));
                  getWindow().setNavigationBarColor(Color.BLACK);

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);

                  FrameLayout.LayoutParams webLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  root.addView(webView, webLp);
                  FrameLayout.LayoutParams progressLp = new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 5);
                  root.addView(progress, progressLp);
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(false);
                  s.setUseWideViewPort(false);
                  s.setSupportZoom(false);
                  s.setUserAgentString(s.getUserAgentString() + " LumiChatAndroid/0.15.34");
                  WebView.setWebContentsDebuggingEnabled(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return route(request.getUrl());
                      }
                      @SuppressWarnings("deprecation")
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return route(Uri.parse(url));
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          progress.setVisibility(View.GONE);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                          progress.setVisibility(newProgress >= 100 ? View.GONE : View.VISIBLE);
                      }
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent intent;
                          try { intent = params.createIntent(); }
                          catch (Exception e) { intent = new Intent(Intent.ACTION_OPEN_DOCUMENT).setType("*/*").addCategory(Intent.CATEGORY_OPENABLE); }
                          try { startActivityForResult(intent, FILE_CHOOSER); }
                          catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              Toast.makeText(MainActivity.this, "파일 선택기를 열 수 없어요.", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                      catch (Exception e) { Toast.makeText(this, "다운로드 링크를 열 수 없어요.", Toast.LENGTH_SHORT).show(); }
                  });

                  if (savedInstanceState == null) webView.loadUrl(HOME);
                  else webView.restoreState(savedInstanceState);
              }

              private boolean route(Uri uri) {
                  String host = uri.getHost();
                  if ("https".equalsIgnoreCase(uri.getScheme()) && "leso12.github.io".equalsIgnoreCase(host)) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                  catch (Exception e) { Toast.makeText(this, "외부 링크를 열 수 없어요.", Toast.LENGTH_SHORT).show(); }
                  return true;
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER || fileCallback == null) return;
                  Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                  fileCallback.onReceiveValue(result);
                  fileCallback = null;
              }

              @Override protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=false\n' > "$ROOT/gradle.properties"
      - name: Build debug-signed APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lumichat-android"
          cd "$ROOT"
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$GITHUB_WORKSPACE/mobile/lumichat/downloads"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/mobile/lumichat/downloads/LumiChat-v0.15.34-P0.apk"
          cd "$GITHUB_WORKSPACE"
          unzip -l mobile/lumichat/downloads/LumiChat-v0.15.34-P0.apk | grep -q 'AndroidManifest.xml'
          unzip -l mobile/lumichat/downloads/LumiChat-v0.15.34-P0.apk | grep -q 'classes.dex'
          sha256sum mobile/lumichat/downloads/LumiChat-v0.15.34-P0.apk > .deploy/lumichat-apk-01534.sha256
          rm -f .deploy/lumichat-apk-01534-trigger.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LumiChat-v0.15.34-P0-APK
          path: mobile/lumichat/downloads/LumiChat-v0.15.34-P0.apk
          if-no-files-found: error
      - name: Commit APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lumichat/downloads/LumiChat-v0.15.34-P0.apk .deploy/lumichat-apk-01534.sha256 .deploy/lumichat-apk-01534-trigger.txt
          git commit -m 'Build LumiChat Android APK v0.15.34 P0'
          git push
