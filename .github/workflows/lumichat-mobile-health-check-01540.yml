name: LumiChat Mobile Public Health v0.15.40 P8

on:
  push:
    paths:
      - '.deploy/lumichat-health-01540-trigger.txt'

permissions:
  contents: write

jobs:
  public-health:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages and verify public P8
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://leso12.github.io/mobile/lumichat'
          OK=0
          for i in $(seq 1 36); do
            curl -fsSL --retry 2 --retry-delay 1 "$BASE/index.html?health=01540-$i" -o /tmp/index.html || true
            curl -fsSL --retry 2 --retry-delay 1 "$BASE/core.js?health=01540-$i" -o /tmp/core.js || true
            curl -fsSL --retry 2 --retry-delay 1 "$BASE/app.js?health=01540-$i" -o /tmp/app.js || true
            curl -fsSL --retry 2 --retry-delay 1 "$BASE/lumi-geometry.css?health=01540-$i" -o /tmp/geo.css || true
            curl -fsSL --retry 2 --retry-delay 1 "$BASE/lumi-theme.css?health=01540-$i" -o /tmp/theme.css || true
            curl -fsSL --retry 2 --retry-delay 1 "$BASE/managers.js?health=01540-$i" -o /tmp/managers.js || true
            curl -fsSL --retry 2 --retry-delay 1 "$BASE/sw.js?health=01540-$i" -o /tmp/sw.js || true
            if grep -Fq 'LumiChat v0.15.40 Mobile' /tmp/index.html 2>/dev/null \
              && grep -Fq 'app.js?boot=01540' /tmp/index.html \
              && grep -Fq 'lumichat-mobile-v01531' /tmp/index.html \
              && grep -Fq "APP_VERSION='0.15.40'" /tmp/core.js \
              && grep -Fq 'SCHEMA_VERSION=19' /tmp/core.js \
              && grep -Fq 'mobile-settings-group' /tmp/app.js \
              && grep -Fq '아직 북마크가 없어요' /tmp/app.js \
              && grep -Fq '기록 · 보관' /tmp/app.js \
              && grep -Fq 'P8 clean settings / forms / empty states — v0.15.40' /tmp/geo.css \
              && grep -Fq -- '--lumi-m-row-h:60px' /tmp/geo.css \
              && grep -Fq 'P8 clean-settings theme coverage — v0.15.40' /tmp/theme.css \
              && grep -Fq 'mobile-managed-editor' /tmp/managers.js \
              && grep -Fq 'v0.15.40' /tmp/sw.js; then
              OK=1
              break
            fi
            sleep 5
          done
          test "$OK" = 1
          cat > .deploy/lumichat-health-01540-result.txt <<EOF
          frontend=v0.15.40
          public_url=https://leso12.github.io/mobile/lumichat/
          index_ok=true
          core_version=0.15.40
          schema=19
          backend_gateway=v01531
          p8_grouped_thread_settings=true
          p8_appearance_sections=true
          p8_bookmark_empty_state=true
          p8_row_control_geometry=true
          p8_theme_coverage=true
          p8_managed_editor=true
          service_worker_ok=true
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          rm -f .deploy/lumichat-health-01540-trigger.txt
      - name: Commit public health result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy/lumichat-health-01540-result.txt .deploy/lumichat-health-01540-trigger.txt
          git commit -m 'Verify LumiChat mobile public v0.15.40 P8'
          git push
