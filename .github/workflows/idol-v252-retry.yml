name: Idol Simulator v25.2 Verified Retry

on:
  push:
    paths:
      - '.github/workflows/idol-v252-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idol-v252-verified-retry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract patch, apply, and verify
        shell: bash
        run: |
          set -euo pipefail
          echo '75c659d88e8748c9311c1f4ea7f33c09233661dbb158777ab27e4f3a0c83b2cb  mobile/idol/index.html' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import base64
          w=Path('.github/workflows/idol-v252-deploy.yml').read_text(encoding='utf-8')
          payload=w.split("<<'PATCH_B64'\n",1)[1].split('\nPATCH_B64',1)[0]
          payload=''.join(payload.split())
          Path('/tmp/idol-v252.patch').write_bytes(base64.b64decode(payload, validate=True))
          print('patch bytes:', Path('/tmp/idol-v252.patch').stat().st_size)
          PY
          git apply --check /tmp/idol-v252.patch
          git apply /tmp/idol-v252.patch
          echo '7add022cd9fe9f875ed157ba44c4b614d1bc23849db48de8769fb1ccfccc7061  mobile/idol/index.html' | sha256sum -c -
          grep -q '<meta name="idol-sim-version" content="2.5.2">' mobile/idol/index.html
          grep -q 'idol-v252-relation-cleanup' mobile/idol/index.html
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('mobile/idol/index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/idol-v252-scripts.js').write_text(scripts,encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup:
              raise SystemExit('duplicate ids: '+', '.join(dup[:20]))
          print('duplicate-id check: PASS')
          PY
          node --check /tmp/idol-v252-scripts.js

      - name: Commit verified v25.2 and cleanup staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .idol-v252
          rm -f .github/workflows/idol-v252-deploy.yml .github/workflows/idol-v252-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy idol simulator v25.2 relationship cleanup'
          git push origin HEAD:main
