name: Idol Simulator v25.2 Direct Verified Patch

on:
  push:
    paths:
      - '.github/workflows/idol-v252-directpatch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idol-v252-direct-verified
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic v25.2 source patch
        shell: bash
        run: |
          set -euo pipefail
          echo '75c659d88e8748c9311c1f4ea7f33c09233661dbb158777ab27e4f3a0c83b2cb  mobile/idol/index.html' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile/idol/index.html')
          s=p.read_text(encoding='utf-8')

          assert '<meta name="idol-sim-version" content="2.5.1">' in s
          s=s.replace('<meta name="idol-sim-version" content="2.5.1">','<meta name="idol-sim-version" content="2.5.2">',1)

          old='.relation-tier-track { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; align-items:start; }'
          new='.relation-tier-track { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:4px; align-items:start; }'
          assert old in s; s=s.replace(old,new,1)
          anchor='.relation-tier-node.active i { border-color:var(--pair-color,var(--accent)); box-shadow:0 0 0 3px color-mix(in srgb,var(--pair-color,var(--accent)) 10%,transparent); }\n'
          lovercss=""".relation-tier-node.lover-stage { color:#c94e7c; }
          .relation-tier-node.lover-stage.active { color:#d93f7c; opacity:1; }
          .relation-tier-node.lover-stage.active i { border-color:#e26a9b; background:rgba(255,120,170,.12); box-shadow:0 0 0 3px rgba(226,106,155,.10); }
          .relation-tier-node.lover-stage.disabled { opacity:.25; filter:grayscale(.55); }
          .relation-tier-node.lover-stage.disabled i::after { content:'🔒'; position:absolute; right:-5px; bottom:-5px; font-size:.48rem; line-height:1; }

          """
          assert anchor in s; s=s.replace(anchor,anchor+lovercss,1)

          cleanup="""<style id="idol-v252-relation-cleanup">
          /* v25.2: 관계 카드는 현재 상태 1회 + 통합 단계 바 중심으로 단순화 */
          .relation-pair-card .relation-romance-track,
          .ev-pair-summary .relation-romance-track,
          .pair-detail-modal .relation-romance-track{display:none!important}
          .relation-pair-card .relation-pair-change,
          .ev-pair-summary .ev-trend{display:none!important}
          .relation-pair-card .relation-tier-wrap{margin-top:10px}
          .relation-pair-card .relation-pair-head{min-height:28px}
          .relation-romance-pill{font-size:.68rem;padding:4px 9px;font-weight:850}
          </style>
          """
          assert '</style></head>' in s
          s=s.replace('</style></head>','</style>\n'+cleanup+'</head>',1)

          start=s.index('function relationMeterHtml(rel, compact=false){')
          end=s.index('function relationRecentDelta',start)
          meter="""function relationMeterHtml(rel, compact=false, a=null, b=null){
            const RM=window.RelationsModule;
            const tier=RM.getRelationDisplayTier(rel), tiers=RM.RELATION_DISPLAY_TIERS||[];
            const baseActive=Math.max(0,tiers.findIndex(t=>t.id===tier.id));
            const lover=RM.isLover(rel);
            const policy=(a&&b)?relationRomancePolicy(a,b,rel):{ok:true,reason:''};
            const loverDisabled=!lover && !policy.ok;
            const nodes=tiers.map((t,i)=>({id:t.id,icon:t.icon,label:t.short,active:!lover&&i===baseActive,passed:lover||(!lover&&i<baseActive),disabled:false,lover:false}));
            nodes.push({id:'lover',icon:'💗',label:'연인',active:lover,passed:false,disabled:loverDisabled,lover:true});
            const currentLabel=lover?'연인':tier.label;
            return `<div class="relation-tier-wrap${compact?' compact':''}">
              <div class="relation-tier-track" aria-label="관계 단계 ${escapeAttr(currentLabel)}">${nodes.map(n=>`<span class="relation-tier-node ${n.active?'active':n.passed?'passed':''}${n.lover?' lover-stage':''}${n.disabled?' disabled':''}" title="${escapeAttr(n.disabled?(policy.reason||'현재 연애 진행 불가'):n.label)}"><i>${n.icon}</i>${compact?'':`<b>${escapeHtml(n.label)}</b>`}</span>`).join('')}</div>
            </div>`;
          }
          """
          s=s[:start]+meter+s[end:]

          start=s.index('function relationRomanceBadgeHtml(rel, showNone=true){')
          end=s.index('function relationStatusBadgesHtml',start)
          badge="""function relationRomanceBadgeHtml(rel, showNone=false){
            const RM=window.RelationsModule;
            const romance=RM.getRelationRomanceStatus(rel,APP.state&&APP.state.settings);
            if(!romance.active){
              return showNone?'<span class="relation-romance-pill none">♡ 없음</span>':'';
            }
            return `<span class="relation-romance-pill ${escapeAttr(romance.id)}">${romance.icon} ${escapeHtml(romance.label)}</span>`;
          }
          """
          s=s[:start]+badge+s[end:]

          start=s.index('function relationPairCardHtml(a,b,rel,color){')
          end=s.index('window.focusPairInRelationEvent',start)
          pair="""function relationPairCardHtml(a,b,rel,color){
            const RM=window.RelationsModule;
            const last=Number(rel.lastEventDay)||0;
            return `<div class="relation-pair-card" style="--pair-color:${escapeAttr(color)}">
              <div class="relation-pair-head"><div class="relation-pair-names"><strong>${escapeHtml(a.name)}</strong><span>×</span><strong>${escapeHtml(b.name)}</strong></div>${relationRomanceBadgeHtml(rel,false)}</div>
              ${relationStatusBadgesHtml(rel)}
              ${relationMeterHtml(rel,false,a,b)}
              <div class="relation-pair-footer"><span>${last?`마지막 사건 · Day ${last}`:'아직 관계 사건 없음'}</span><button class="btn-sm relation-detail-btn" onclick="openPairTimeline(${jsArg(a.id)},${jsArg(b.id)})">상세 타임라인 →</button></div>
            </div>`;
          }
          """
          s=s[:start]+pair+s[end:]

          old="const rel=RM.ensureRelation(s,idA,idB), tier=RM.getRelationDisplayTier(rel), romance=RM.getRelationRomanceStatus(rel,s.settings), trend=RM.getRelationTrend(rel,s.day,7);"
          new="const rel=RM.ensureRelation(s,idA,idB), tier=RM.getRelationDisplayTier(rel), romance=RM.getRelationRomanceStatus(rel,s.settings);"
          assert old in s; s=s.replace(old,new,1)
          old="""    <div class="pair-detail-state-row"><span class="relation-intimacy-pill">${tier.icon} 친밀도 · ${escapeHtml(tier.label)}</span>${relationRomanceBadgeHtml(rel,true)}</div>
              ${relationStatusBadgesHtml(rel)}
              ${relationRomanceTrackHtml(a,b,rel)}
              <div class="pair-detail-mood"><strong>${tier.icon} ${escapeHtml(tier.label)}</strong><span>${trend.icon} ${escapeHtml(trend.label)} · 최근 7일 ${signed(trend.delta)}</span></div>
              ${relationMeterHtml(rel)}
          """
          new="""    <div class="pair-detail-state-row">${relationRomanceBadgeHtml(rel,false)}</div>
              ${relationStatusBadgesHtml(rel)}
              ${relationMeterHtml(rel,false,a,b)}
          """
          assert old in s; s=s.replace(old,new,1)

          old="const romance=RM.getRelationRomanceStatus(rel,s.settings),trend=RM.getRelationTrend(rel,s.day,7);"
          new="const romance=RM.getRelationRomanceStatus(rel,s.settings);"
          assert old in s; s=s.replace(old,new,1)
          old="""      <div class="ev-pair-summary-head"><strong>${escapeHtml(a.name)} → ${escapeHtml(b.name)}</strong><span class="relation-stage-pill">${tier.icon} ${escapeHtml(tier.short)}</span>${relationRomanceBadgeHtml(rel,true)}<span class="ev-trend ${trend.delta>0?'up':trend.delta<0?'down':'flat'}">${trend.icon} ${trend.delta>0?'+':''}${trend.delta}</span></div>
                ${relationStatusBadgesHtml(rel)}
                ${relationRomanceTrackHtml(a,b,rel)}
                ${relationMeterHtml(rel,true)}
          """
          new="""      <div class="ev-pair-summary-head"><strong>${escapeHtml(a.name)} → ${escapeHtml(b.name)}</strong>${relationRomanceBadgeHtml(rel,false)}</div>
                ${relationStatusBadgesHtml(rel)}
                ${relationMeterHtml(rel,true,a,b)}
          """
          assert old in s; s=s.replace(old,new,1)

          comment='<!-- idol-v25.1 full-QA hardening + atomic-import + storage-safety build -->\n'
          assert comment in s
          s=s.replace(comment,comment+'<!-- idol-v25.2 relation-card cleanup build -->\n',1)
          p.write_text(s,encoding='utf-8')
          PY

          echo '7add022cd9fe9f875ed157ba44c4b614d1bc23849db48de8769fb1ccfccc7061  mobile/idol/index.html' | sha256sum -c -
          grep -q '<meta name="idol-sim-version" content="2.5.2">' mobile/idol/index.html
          grep -q 'idol-v252-relation-cleanup' mobile/idol/index.html
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('mobile/idol/index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/idol-v252-scripts.js').write_text(scripts,encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+', '.join(dup[:20]))
          print('duplicate-id check: PASS')
          PY
          node --check /tmp/idol-v252-scripts.js

      - name: Commit verified v25.2 and cleanup staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .idol-v252
          rm -f .github/workflows/idol-v252-deploy.yml .github/workflows/idol-v252-retry.yml .github/workflows/idol-v252-directpatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy idol simulator v25.2 relationship cleanup'
          git push origin HEAD:main
