name: LumiChat Mobile Health Check

on:
  push:
    paths:
      - '.deploy/lumichat-health-trigger.txt'

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public LumiChat v0.15.33 frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://leso12.github.io/mobile/lumichat'
          BUST="01533-$(date +%s)"
          FRONT=$(curl -fsSL --retry 10 --retry-delay 3 "$BASE/?health=$BUST")
          CORE=$(curl -fsSL --retry 10 --retry-delay 3 "$BASE/core.js?health=$BUST")
          GEOM=$(curl -fsSL --retry 10 --retry-delay 3 "$BASE/lumi-geometry.css?health=$BUST")
          THEME=$(curl -fsSL --retry 10 --retry-delay 3 "$BASE/lumi-theme.css?health=$BUST")
          SW=$(curl -fsSL --retry 10 --retry-delay 3 "$BASE/sw.js?health=$BUST")

          echo "$FRONT" | grep -Fq 'LumiChat v0.15.33 Mobile'
          echo "$FRONT" | grep -Fq 'lumi-theme.css?v=01533'
          echo "$FRONT" | grep -Fq 'lumi-geometry.css?v=01533'
          echo "$CORE" | grep -Fq "APP_VERSION='0.15.33'"
          echo "$CORE" | grep -Fq 'SCHEMA_VERSION=19'
          echo "$GEOM" | grep -Fq 'LumiChat v0.15.33'
          echo "$THEME" | grep -Fq 'LumiChat'
          echo "$SW" | grep -Fq '01533'

          printf 'frontend=v0.15.33\npublic_url=%s/\nindex_ok=true\ncore_version=0.15.33\nschema=19\ntheme_ok=true\ngeometry_ok=true\nservice_worker_ok=true\nchecked_at=%s\n' "$BASE" "$(date -u +%FT%TZ)" > .deploy/lumichat-health-result.txt
          rm -f .deploy/lumichat-health-trigger.txt

      - name: Commit health result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .deploy/lumichat-health-result.txt .deploy/lumichat-health-trigger.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Verify LumiChat public mobile v0.15.33'
          git push
