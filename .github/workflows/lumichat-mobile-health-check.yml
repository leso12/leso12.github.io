name: LumiChat Mobile Health Check

on:
  push:
    paths:
      - '.deploy/lumichat-health-trigger.txt'

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public LumiChat v0.15.38 P6 frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://leso12.github.io/mobile/lumichat'
          BUST="01538-$(date +%s)"
          FRONT=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/?health=$BUST")
          CORE=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/core.js?health=$BUST")
          APP=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/app.js?health=$BUST")
          EDITORS=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/editors.js?health=$BUST")
          GEOM=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/lumi-geometry.css?health=$BUST")
          LEGACY=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/v01526-ui-system.css?health=$BUST")
          UX=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/v01529-mobile-ux.css?health=$BUST")
          SW=$(curl -fsSL --retry 20 --retry-delay 3 "$BASE/sw.js?health=$BUST")
          echo "$FRONT" | grep -Fq 'LumiChat v0.15.38 Mobile'
          echo "$FRONT" | grep -Fq 'lumi-geometry.css?v=01538'
          echo "$FRONT" | grep -Fq 'lumichat-mobile-v01531'
          echo "$CORE" | grep -Fq "APP_VERSION='0.15.38'"
          echo "$CORE" | grep -Fq 'SCHEMA_VERSION=19'
          echo "$APP" | grep -Fq "primary.textContent='에피소드 저장'"
          echo "$EDITORS" | grep -Fq 'creatorSecondaryAction'
          echo "$GEOM" | grep -Fq 'P6 mobile editor visual polish — v0.15.38'
          echo "$GEOM" | grep -Fq '.form-tabs.five button.active::after'
          echo "$GEOM" | grep -Fq '.creator-form .episode-inline-actions{display:none!important}'
          ! echo "$LEGACY" | grep -Fq 'color:#fff;border-bottom-color:#fff'
          ! echo "$UX" | grep -Fq '.expert-switch span:last-child{display:none'
          echo "$SW" | grep -Fq 'v0.15.38'
          printf 'frontend=v0.15.38\npublic_url=%s/\nindex_ok=true\ncore_version=0.15.38\nschema=19\nbackend_gateway=v01531\np6_tabs_same_text_color=true\np6_accent_underline=true\np6_single_action_row=true\np6_legacy_white_tab_removed=true\np6_expert_label_visible=true\nservice_worker_ok=true\nchecked_at=%s\n' "$BASE" "$(date -u +%FT%TZ)" > .deploy/lumichat-health-result.txt
          rm -f .deploy/lumichat-health-trigger.txt
      - name: Commit health result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .deploy/lumichat-health-result.txt .deploy/lumichat-health-trigger.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Verify LumiChat public mobile v0.15.38 P6'
          git push
