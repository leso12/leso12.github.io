name: LumiChat Mobile Health Check

on:
  push:
    paths:
      - '.deploy/lumichat-health-trigger.txt'

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public LumiChat v0.15.38 P6 frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://leso12.github.io/mobile/lumichat'
          READY=''
          for i in $(seq 1 40); do
            BUST="01538-${GITHUB_RUN_ID}-${i}-$(date +%s)"
            if curl -fsSL "$BASE/?health=$BUST" -o /tmp/front.html && grep -Fq 'LumiChat v0.15.38 Mobile' /tmp/front.html; then
              READY=1
              break
            fi
            echo "Waiting for Pages propagation ($i/40)..."
            sleep 5
          done
          test -n "$READY"
          BUST="01538-${GITHUB_RUN_ID}-final-$(date +%s)"
          curl -fsSL "$BASE/?health=$BUST" -o /tmp/front.html
          curl -fsSL "$BASE/core.js?health=$BUST" -o /tmp/core.js
          curl -fsSL "$BASE/app.js?health=$BUST" -o /tmp/app.js
          curl -fsSL "$BASE/editors.js?health=$BUST" -o /tmp/editors.js
          curl -fsSL "$BASE/lumi-geometry.css?health=$BUST" -o /tmp/geometry.css
          curl -fsSL "$BASE/v01526-ui-system.css?health=$BUST" -o /tmp/legacy.css
          curl -fsSL "$BASE/v01529-mobile-ux.css?health=$BUST" -o /tmp/ux.css
          curl -fsSL "$BASE/sw.js?health=$BUST" -o /tmp/sw.js

          grep -Fq 'LumiChat v0.15.38 Mobile' /tmp/front.html
          grep -Fq 'lumi-geometry.css?v=01538' /tmp/front.html
          grep -Fq 'lumichat-mobile-v01531' /tmp/front.html
          grep -Fq "APP_VERSION='0.15.38'" /tmp/core.js
          grep -Fq 'SCHEMA_VERSION=19' /tmp/core.js
          grep -Fq "primary.textContent='에피소드 저장'" /tmp/app.js
          grep -Fq 'creatorSecondaryAction' /tmp/editors.js
          grep -Fq 'P6 mobile editor visual polish — v0.15.38' /tmp/geometry.css
          grep -Fq '.form-tabs.five button.active::after' /tmp/geometry.css
          grep -Fq '.creator-form .episode-inline-actions{display:none!important}' /tmp/geometry.css
          ! grep -Fq 'color:#fff;border-bottom-color:#fff' /tmp/legacy.css
          ! grep -Fq '.expert-switch span:last-child{display:none' /tmp/ux.css
          grep -Fq 'v0.15.38' /tmp/sw.js

          printf 'frontend=v0.15.38\npublic_url=%s/\nindex_ok=true\ncore_version=0.15.38\nschema=19\nbackend_gateway=v01531\np6_tabs_same_text_color=true\np6_accent_underline=true\np6_single_action_row=true\np6_legacy_white_tab_removed=true\np6_expert_label_visible=true\nservice_worker_ok=true\nchecked_at=%s\n' "$BASE" "$(date -u +%FT%TZ)" > .deploy/lumichat-health-result.txt
          rm -f .deploy/lumichat-health-trigger.txt
      - name: Commit health result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .deploy/lumichat-health-result.txt .deploy/lumichat-health-trigger.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Verify LumiChat public mobile v0.15.38 P6'
          git push
