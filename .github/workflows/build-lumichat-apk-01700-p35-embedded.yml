name: Build LumiChat Android APK v0.17.0 P35 Embedded

on:
  push:
    paths:
      - '.deploy/lumichat-apk-01700-p35-embedded-trigger.txt'

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and reconstruct P35 mobile payload
        shell: bash
        run: |
          set -euo pipefail
          D='.deploy/lumichat_p35_clean_20260907'
          echo '6e6d796403b404b4324305e01700bec7b92fc7f2fa0a1046d2e60684b1f4dbe9  '$D'/part00' | sha256sum -c -
          echo '7247aede85eff09f1144ae793b30174dd67afdb96f7d8a5dffcff0813be78658  '$D'/part01' | sha256sum -c -
          echo 'b7a92b8a4d1615f8342c8e7369f799bfa93daca865b29debe08cdb1319650c8e  '$D'/part02' | sha256sum -c -
          echo 'dccd06eec5500e8490377fab2d08b96a75fbf202a9f0cf0b04db61e638c7b4a6  '$D'/part03' | sha256sum -c -
          echo '96b5eb0461c17ccf89d438246e505691ad844f908290f2d3d76e54e33b98e28b  '$D'/part04' | sha256sum -c -
          echo 'e4c027403a927b17dad45ad2843968f80edc4d3b8d97f7af59ab196b8480c082  '$D'/part05' | sha256sum -c -
          echo 'c89cd552c2d652bcc74024d2484ce6e7eb3551710670cfa8483008856932d57a  '$D'/part06' | sha256sum -c -
          echo '5fc4a0cd5f9478cdbf7a959e1baba6437de355ed5cd99b419d8824abdb3855e7  '$D'/part07' | sha256sum -c -
          echo '2b472ab2de06789e4b8d73863e6d378982c5825654e751aca4f97cfb5168ec0a  '$D'/part08' | sha256sum -c -
          echo 'cc64c99bf52add703646b0c876dc6b86c9a0d9b2afd5c76ae678c23c2dd39999  '$D'/part09' | sha256sum -c -
          echo '1643d8372499380ea0c9bf74b854f9a1bebabc43757b36818e6a3fde0d675821  '$D'/part10' | sha256sum -c -
          echo '4a0fc328424b685728b1c19a1888aed43cb9d06c246933843a7a96e486688492  '$D'/part11' | sha256sum -c -
          echo '11d495f33b12d5a062071e11807f73dcfd173ee5b58d7b28ee8c1ecaf42b8b6f  '$D'/part12' | sha256sum -c -
          echo '25ae96802e7db595014a084284e5deedf4c84bb70db3b2fe3d165f1afc1840f6  '$D'/part13' | sha256sum -c -
          echo '2a797a09cb1d96a7cd2cf055d3b152434b90f5bbf586244f27cd06e6ff0b1d43  '$D'/part14' | sha256sum -c -
          echo 'f6d73b85e8c8cd2e546745e2178ea4450337f12c78788b25e3159722b4c651f5  '$D'/part15' | sha256sum -c -
          cat "$D"/part{00..15} > /tmp/p35.b64
          echo 'a4b8e50780f2872d62efea3da5405468923b11ab6793afde39cc671d043d578c  /tmp/p35.b64' | sha256sum -c -
          base64 -d /tmp/p35.b64 > /tmp/mobile-pwa.tar.xz
          echo '02d793b28ffd799d5cd9579dc07f603020d107ae06210d533d4b237713c02798  /tmp/mobile-pwa.tar.xz' | sha256sum -c -
          xz -t /tmp/mobile-pwa.tar.xz
          mkdir -p /tmp/p35
          tar -xJf /tmp/mobile-pwa.tar.xz -C /tmp/p35
          test -f /tmp/p35/mobile-pwa/index.html
          grep -Fq 'LumiChat v0.17.0 P35 Style Scope UI Cleanup Mobile' /tmp/p35/mobile-pwa/index.html
          grep -Fq 'p35-style-scope-ui.css?v=01700p35' /tmp/p35/mobile-pwa/index.html
          grep -Fq "APP_VERSION='0.17.0'" /tmp/p35/mobile-pwa/core.js

      - name: Prepare embedded P35 assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lumichat-p35-android"
          mkdir -p "$ROOT/app/src/main/assets" "$ROOT/app/src/main/java/io/github/leso12/lumichat" "$ROOT/app/src/main/res/values"
          cp -a /tmp/p35/mobile-pwa/. "$ROOT/app/src/main/assets/"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'lumichat-p35-android/app/src/main/assets/app.js'
          s=p.read_text(encoding='utf-8')
          pat=r"async function registerMobilePwa\(\)\{.*?\}\n\n"
          s2,n=re.subn(pat,"async function registerMobilePwa(){return}\n\n",s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('Could not disable APK service-worker registration safely')
          p.write_text(s2,encoding='utf-8')
          PY
          cat > "$ROOT/app/src/main/assets/p35-bootstrap.html" <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c0e"><style>html,body{margin:0;background:#0b0c0e;color:#e8e8e8;font-family:sans-serif;height:100%}body{display:grid;place-items:center}.box{text-align:center}.dot{width:28px;height:28px;margin:0 auto 14px;border:3px solid #444;border-top-color:#e1b955;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#999}</style></head><body><div class="box"><div class="dot"></div><b>LumiChat P35 준비 중…</b><br><small>오래된 모바일 캐시만 정리하고 있어요.</small></div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.filter(r=>String(r.scope||'').includes('/mobile/lumichat/')).map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>String(k).startsWith('lumichat-mobile-')).map(k=>caches.delete))}}catch(e){console.warn(e)}location.replace('https://leso12.github.io/mobile/lumichat/index.html?embedded=01700p35')})()</script></body></html>
          EOF

      - name: Generate Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lumichat-p35-android"
          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='LumiChatP35'
          include ':app'
          EOF
          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'io.github.leso12.lumichat'
              compileSdk 35
              defaultConfig {
                  applicationId 'io.github.leso12.lumichat'
                  minSdk 26
                  targetSdk 35
                  versionCode 170035
                  versionName '0.17.0-P35'
              }
              buildTypes { debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF
          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0C0E</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF
          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="LumiChat P35" android:theme="@style/AppTheme" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > "$ROOT/app/src/main/java/io/github/leso12/lumichat/MainActivity.java" <<'EOF'
          package io.github.leso12.lumichat;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final String APP_DOMAIN = "leso12.github.io";
              private static final String BOOT = "https://leso12.github.io/__lumichat_p35_embedded__/p35-bootstrap.html";
              private static final int FILE_CHOOSER = 170035;
              private WebView webView;
              private ProgressBar progress;
              private ValueCallback<Uri[]> fileCallback;
              private WebViewAssetLoader assetLoader;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(11,12,14));
                  getWindow().setNavigationBarColor(Color.BLACK);

                  assetLoader = new WebViewAssetLoader.Builder()
                      .setDomain(APP_DOMAIN)
                      .addPathHandler("/mobile/lumichat/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .addPathHandler("/__lumichat_p35_embedded__/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  root.addView(webView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(progress, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 5));
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(false);
                  s.setUseWideViewPort(false);
                  s.setSupportZoom(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUserAgentString(s.getUserAgentString() + " LumiChatAndroid/0.17.0-P35-Embedded");
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  WebView.setWebContentsDebuggingEnabled(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          WebResourceResponse local = assetLoader.shouldInterceptRequest(request.getUrl());
                          return local != null ? local : super.shouldInterceptRequest(view, request);
                      }
                      @SuppressWarnings("deprecation")
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          WebResourceResponse local = assetLoader.shouldInterceptRequest(Uri.parse(url));
                          return local != null ? local : super.shouldInterceptRequest(view, url);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) { return route(request.getUrl()); }
                      @SuppressWarnings("deprecation")
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) { return route(Uri.parse(url)); }
                      @Override public void onPageFinished(WebView view, String url) { progress.setVisibility(View.GONE); }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                          progress.setVisibility(newProgress >= 100 ? View.GONE : View.VISIBLE);
                      }
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent intent;
                          try { intent = params.createIntent(); }
                          catch (Exception e) { intent = new Intent(Intent.ACTION_OPEN_DOCUMENT).setType("*/*").addCategory(Intent.CATEGORY_OPENABLE); }
                          try { startActivityForResult(intent, FILE_CHOOSER); }
                          catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              Toast.makeText(MainActivity.this, "파일 선택기를 열 수 없어요.", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setDownloadListener((url, ua, cd, mime, len) -> {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                      catch (Exception e) { Toast.makeText(this, "다운로드 링크를 열 수 없어요.", Toast.LENGTH_SHORT).show(); }
                  });

                  if (savedInstanceState == null) webView.loadUrl(BOOT); else webView.restoreState(savedInstanceState);
              }

              private boolean route(Uri uri) {
                  String scheme = uri.getScheme();
                  String host = uri.getHost();
                  if (("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme)) && APP_DOMAIN.equalsIgnoreCase(host)) return false;
                  if ("about".equalsIgnoreCase(scheme)) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                  catch (Exception e) { Toast.makeText(this, "외부 링크를 열 수 없어요.", Toast.LENGTH_SHORT).show(); }
                  return true;
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER || fileCallback == null) return;
                  fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                  fileCallback = null;
              }

              @Override protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build and verify embedded P35 APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lumichat-p35-android"
          cd "$ROOT"
          gradle --no-daemon :app:assembleDebug
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/p35-style-scope-ui.css'
          unzip -p "$APK" assets/index.html | grep -Fq 'LumiChat v0.17.0 P35 Style Scope UI Cleanup Mobile'
          unzip -p "$APK" assets/index.html | grep -Fq 'p35-style-scope-ui.css?v=01700p35'
          unzip -p "$APK" assets/core.js | grep -Fq "APP_VERSION='0.17.0'"
          unzip -p "$APK" assets/app.js | grep -Fq 'async function registerMobilePwa(){return}'
          mkdir -p "$GITHUB_WORKSPACE/mobile/lumichat/downloads"
          OUT="$GITHUB_WORKSPACE/mobile/lumichat/downloads/LumiChat-v0.17.0-P35-Embedded.apk"
          cp "$APK" "$OUT"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$OUT" > .deploy/lumichat-apk-01700-p35-embedded.sha256
          rm -f .deploy/lumichat-apk-01700-p35-embedded-trigger.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LumiChat-v0.17.0-P35-Embedded-APK
          path: mobile/lumichat/downloads/LumiChat-v0.17.0-P35-Embedded.apk
          if-no-files-found: error

      - name: Commit APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lumichat/downloads/LumiChat-v0.17.0-P35-Embedded.apk .deploy/lumichat-apk-01700-p35-embedded.sha256 .deploy/lumichat-apk-01700-p35-embedded-trigger.txt
          git commit -m 'Build embedded LumiChat Android APK v0.17.0 P35'
          git push
