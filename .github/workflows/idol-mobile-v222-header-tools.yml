name: Idol Mobile v22.2 Header Quick Tools

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/idol-mobile-v222-header-tools.yml'

permissions:
  contents: write

concurrency:
  group: idol-mobile-v222-header-tools
  cancel-in-progress: true

jobs:
  patch-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v22.2 mobile header/data layout
        run: python3 scripts/patch-idol-mobile-v222.py

      - name: Validate v22.2 output
        run: |
          grep -q 'idol-sim-version" content="2.2.2' mobile/idol/index.html
          grep -q 'idol-mobile-v222-layout' mobile/idol/index.html
          grep -q 'mobile-header-quick quick-save' mobile/idol/index.html
          ! grep -q 'class="mobile-data-tools"' mobile/idol/index.html
          grep -q '저장 · 데이터 관리' mobile/idol/index.html

      - name: Commit mobile v22.2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/idol/index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Deploy idol mobile v22.2 header quick tools'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
