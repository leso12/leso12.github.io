name: Idol v24 Dashboard and Relation UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/idol-v240-deploy.yml'

permissions:
  contents: write

concurrency:
  group: idol-v240-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v24 common UI and relation-state patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('mobile/idol/index.html')
          s=p.read_text(encoding='utf-8')
          if 'idol-sim-version" content="2.4.0' in s:
              print('v24 already applied')
              raise SystemExit(0)
          assert 'idol-sim-version" content="2.3.0' in s, 'expected v23 base'
          s=re.sub(r'<meta name="idol-sim-version" content="[^"]+">','<meta name="idol-sim-version" content="2.4.0">',s,count=1)

          dash=r'''  <!-- 대시보드 -->
          <section id="tab-dashboard" class="tab-panel active dashboard-v24">
            <div class="dashboard-v24-summary">
              <section class="dashboard-v23-card dashboard-hero" aria-label="그룹 현황">
                <div class="dashboard-hero-main">
                  <div class="dashboard-eyebrow">CURRENT GROUP</div>
                  <div class="dashboard-hero-title-row"><h2 id="dash-group">—</h2><span class="dashboard-activity-pill" id="dash-album">활동 없음</span></div>
                  <div class="dashboard-hero-meta"><span>👥 <b id="dash-members">0명</b></span><span>📅 <b id="dash-day">Day 1</b></span><span>💰 <b id="dash-money">5,000원</b></span></div>
                </div><button class="dashboard-hero-link" onclick="switchTab('members')">멤버 보기 →</button>
              </section>
              <section class="dashboard-v23-card dashboard-kpi-card" aria-label="그룹 지표">
                <div class="dashboard-section-head compact"><div><span class="dashboard-section-kicker">GROUP SCORE</span><h3>그룹 지표</h3></div></div>
                <div class="dashboard-kpi-strip"><div class="dashboard-kpi-item"><span class="dashboard-kpi-icon">⭐</span><span class="dashboard-kpi-label">인기도</span><strong id="dash-pop">0</strong></div><div class="dashboard-kpi-item"><span class="dashboard-kpi-icon">💜</span><span class="dashboard-kpi-label">팬덤</span><strong id="dash-fandom">0</strong></div><div class="dashboard-kpi-item"><span class="dashboard-kpi-icon">🏆</span><span class="dashboard-kpi-label">평판</span><strong id="dash-rep">0</strong></div></div>
              </section>
            </div>
            <div class="dashboard-v24-main">
              <section class="dashboard-v23-card dashboard-schedule-card dashboard-v24-equal-top"><div class="dashboard-section-head"><div><span class="dashboard-section-kicker">TODAY</span><h3>오늘 스케줄</h3></div><button class="dashboard-section-link" onclick="switchTab('schedule')">스케줄 관리 →</button></div><div id="dash-schedule" class="dashboard-schedule-list"><div class="dashboard-empty-state"><span>🗓️</span><b>아직 일정이 없어요</b><small>멤버별 오늘 일정을 배정해보세요.</small><button class="dashboard-empty-action" onclick="switchTab('schedule')">스케줄 배정하기</button></div></div><div class="dashboard-day-actions"><button class="btn btn-day" onclick="onNextDay()">▶ 다음날</button><button class="btn btn-day btn-day2" onclick="onNext7Days()">⏩ 7일 진행</button></div><div class="dashboard-helper">스케줄 미배정 시 전원 자동 휴식 · 컨디션 불량 시 강제 휴식</div></section>
              <section class="dashboard-v23-card dashboard-alert-card dashboard-v24-equal-top" id="dash-alert-card"><div class="dashboard-section-head"><div><span class="dashboard-section-kicker">CHECK</span><h3>오늘 체크</h3></div><span class="dashboard-count-badge" id="dash-alert-count"></span></div><div id="dash-alerts" class="dashboard-alerts"><div class="empty-hint compact">특이사항이 없습니다.</div></div></section>
              <section class="dashboard-v23-card dashboard-log-card dashboard-v24-equal-bottom"><div class="dashboard-section-head"><div><span class="dashboard-section-kicker">RECENT</span><h3>최근 로그</h3></div><button class="dashboard-section-link" onclick="switchTab('log')">전체 로그 →</button></div><div class="log-mini log-feed dashboard-log-feed" id="log-mini-dash"></div></section>
              <section class="dashboard-v23-card dashboard-change-card dashboard-v24-equal-bottom"><div class="dashboard-section-head"><div><span class="dashboard-section-kicker">RELATION</span><h3>최근 관계 변화</h3></div><button class="dashboard-section-link" onclick="switchTab('relations')">관계 보기 →</button></div><div id="dash-relation-changes" class="dashboard-relation-changes"><div class="empty-hint compact">최근 관계 변화가 없습니다.</div></div></section>
            </div>
          </section>

          '''
          a=s.index('  <!-- 대시보드 -->'); b=s.index('  <!-- 멤버 -->',a); s=s[:a]+dash+s[b:]

          start=s.index('// v21.3: UI 대표 관계는 공식 관계 상태를 우선한다.')
          end=s.index('function getRelationTrend',start)
          helper='''// UI에서는 친밀도와 연애 관계 상태를 분리해서 보여준다.\nfunction getRelationRomanceStatus(rel, settings) {\n  if (!rel) return {id:'none',icon:'♡',label:'없음',active:false};\n  if (isExLover(rel)) return {id:'exLover',icon:'💔',label:'전 연인',active:true};\n  if (isLover(rel)) return {id:'lover',icon:'💗',label:'연인',active:true};\n  if (hasTag(rel,'flirting') || rel.confessionPending) return {id:'flirting',icon:'✨',label:'썸',active:true};\n  if (hasTag(rel,'crush') || hasTag(rel,'romanticInterest')) return {id:'crush',icon:'💘',label:'호감',active:true};\n  return {id:'none',icon:'♡',label:'없음',active:false};\n}\nfunction getRelationPrimaryDisplay(rel, settings) {\n  const romance=getRelationRomanceStatus(rel,settings);\n  if (romance.id==='lover' || romance.id==='exLover') return {...romance,short:romance.label,official:true};\n  return { ...getRelationDisplayTier(rel), official:false };\n}\nfunction getRelationStatusBadges(rel, settings) {\n  if (!rel) return []; const out=[];\n  if (isAvoiding(rel)) out.push({id:'avoid',icon:'🚫',label:'회피 중'});\n  if (rel.coldWarDaysLeft > 0 || hasTag(rel,'coldWar')) out.push({id:'coldWar',icon:'🧊',label:'냉전 중'});\n  if (hasTag(rel,'jealous')) out.push({id:'jealous',icon:'😣',label:'질투 중'});\n  return out;\n}\n\n'''
          s=s[:start]+helper+s[end:]

          gs=s.index('function getRelationLabel(rel, settings) {'); ge=s.index('function getAllowedTypes',gs)
          s=s[:gs]+'''function getRelationLabel(rel, settings) {\n  const romance=getRelationRomanceStatus(rel,settings);\n  if (romance.id==='lover') return '연인';\n  if (romance.id==='exLover') { if (rel.avoidDaysLeft > 0) return '전 연인 · 회피'; if (rel.coldWarDaysLeft > 0 || hasTag(rel,'coldWar')) return '전 연인 · 냉전'; if (hasTag(rel,'jealous')) return '전 연인 · 질투'; if (hasTag(rel,'flirting')) return '전 연인 · 썸'; return '전 연인'; }\n  if (romance.id==='flirting') return '썸'; if (romance.id==='crush') return '호감'; return getRelationDisplayTier(rel).label;\n}\n\n'''+s[ge:]

          s=s.replace('getRelationDisplayTier, getRelationPrimaryDisplay, getRelationStatusBadges, getRelationTrend, RELATION_DISPLAY_TIERS,','getRelationDisplayTier, getRelationPrimaryDisplay, getRelationRomanceStatus, getRelationStatusBadges, getRelationTrend, RELATION_DISPLAY_TIERS,',1)
          s=s.replace("case 'flirting':\n      RM.changeAffection(rel, rint(4,8), settings);\n      if (RM.isExLover(rel)) RM.addTag(rel, 'flirting');\n      break;\n    case 'date':        RM.changeAffection(rel, rint(5,10), settings); break;","case 'flirting':\n      RM.changeAffection(rel, rint(4,8), settings);\n      if (!RM.isLover(rel)) RM.addTag(rel, 'flirting');\n      break;\n    case 'date':\n      RM.changeAffection(rel, rint(5,10), settings);\n      if (!RM.isLover(rel)) RM.addTag(rel, 'flirting');\n      break;",1)

          m=re.search(r"function relationMeterHtml\(rel, compact=false\)\{.*?\n\}\nfunction relationRecentDelta",s,re.S); assert m
          meter='''function relationMeterHtml(rel, compact=false){\n  const RM=window.RelationsModule; const tier=RM.getRelationDisplayTier(rel), tiers=RM.RELATION_DISPLAY_TIERS||[]; const active=Math.max(0,tiers.findIndex(t=>t.id===tier.id));\n  return `<div class="relation-tier-wrap${compact?' compact':''}"><div class="relation-tier-track" aria-label="친밀도 단계 ${escapeAttr(tier.label)}">${tiers.map((t,i)=>`<span class="relation-tier-node ${i===active?'active':i<active?'passed':''}" title="${escapeAttr(t.label)}"><i>${t.icon}</i>${compact?'':`<b>${escapeHtml(t.short)}</b>`}</span>`).join('')}</div>${compact?'':`<div class="relation-tier-caption"><strong>${tier.icon} 친밀도 · ${escapeHtml(tier.label)}</strong><small>정확한 수치는 상세에서 확인</small></div>`}</div>`;\n}\nfunction relationRecentDelta'''
          s=s[:m.start()]+meter+s[m.end():]

          m=re.search(r"function relationStatusBadgesHtml\(rel\)\{.*?\n\}\nfunction relationPairCardHtml\(a,b,rel,color\)\{.*?\n\}\nwindow\.focusPairInRelationEvent",s,re.S); assert m
          cards='''function relationRomanceBadgeHtml(rel, showNone=true){ const RM=window.RelationsModule; const romance=RM.getRelationRomanceStatus(rel,APP.state&&APP.state.settings); if(!showNone&&!romance.active)return ''; return `<span class="relation-romance-pill ${escapeAttr(romance.id)}">${romance.icon} ${romance.id==='none'?'연애 · 없음':`연애 · ${escapeHtml(romance.label)}`}</span>`;}\nfunction relationStatusBadgesHtml(rel){ const RM=window.RelationsModule; const badges=RM.getRelationStatusBadges(rel,APP.state&&APP.state.settings)||[]; return badges.length?`<div class="relation-status-badges">${badges.map(b=>`<span class="relation-status-badge ${escapeAttr(b.id)}">${b.icon} ${escapeHtml(b.label)}</span>`).join('')}</div>`:'';}\nfunction relationPairCardHtml(a,b,rel,color){ const RM=window.RelationsModule; const tier=RM.getRelationDisplayTier(rel), trend=RM.getRelationTrend(rel,APP.state.day,7); const delta=trend.delta,last=Number(rel.lastEventDay)||0; return `<div class="relation-pair-card" style="--pair-color:${escapeAttr(color)}"><div class="relation-pair-head"><div class="relation-pair-names"><strong>${escapeHtml(a.name)}</strong><span>×</span><strong>${escapeHtml(b.name)}</strong></div>${relationRomanceBadgeHtml(rel,true)}</div>${relationStatusBadgesHtml(rel)}<div class="relation-mood-row"><div class="relation-mood-icon">${tier.icon}</div><div class="relation-mood-copy"><strong>${escapeHtml(tier.label)}</strong><span>${escapeHtml(trend.label)}</span></div><div class="relation-pair-change ${delta>0?'up':delta<0?'down':'flat'}">${trend.icon} 최근 7일 ${delta>0?'+':''}${delta}</div></div>${relationMeterHtml(rel)}<div class="relation-pair-footer"><span>${last?`마지막 사건 · Day ${last}`:'아직 관계 사건 없음'}</span><button class="btn-sm relation-detail-btn" onclick="openPairTimeline(${jsArg(a.id)},${jsArg(b.id)})">상세 타임라인 →</button></div></div>`;}\nwindow.focusPairInRelationEvent'''
          s=s[:m.start()]+cards+s[m.end():]

          s=s.replace("const rel=RM.ensureRelation(s,idA,idB), tier=RM.getRelationPrimaryDisplay(rel,s.settings), trend=RM.getRelationTrend(rel,s.day,7);","const rel=RM.ensureRelation(s,idA,idB), tier=RM.getRelationDisplayTier(rel), romance=RM.getRelationRomanceStatus(rel,s.settings), trend=RM.getRelationTrend(rel,s.day,7);",1)
          s=s.replace('${relationStatusBadgesHtml(rel)}\n    <div class="pair-detail-mood">','<div class="pair-detail-state-row"><span class="relation-intimacy-pill">${tier.icon} 친밀도 · ${escapeHtml(tier.label)}</span>${relationRomanceBadgeHtml(rel,true)}</div>\n    ${relationStatusBadgesHtml(rel)}\n    <div class="pair-detail-mood">',1)
          s=s.replace("const tier=RM.getRelationPrimaryDisplay(rel,s.settings),trend=RM.getRelationTrend(rel,s.day,7);","const tier=RM.getRelationDisplayTier(rel), romance=RM.getRelationRomanceStatus(rel,s.settings),trend=RM.getRelationTrend(rel,s.day,7);",1)
          s=s.replace('<strong>${escapeHtml(a.name)} → ${escapeHtml(b.name)}</strong><span class="relation-stage-pill">${tier.icon} ${escapeHtml(tier.short)}</span><span class="ev-trend','<strong>${escapeHtml(a.name)} → ${escapeHtml(b.name)}</strong><span class="relation-stage-pill">${tier.icon} ${escapeHtml(tier.short)}</span>${relationRomanceBadgeHtml(rel,true)}<span class="ev-trend',1)
          s=s.replace("id==='log-mini-dash'?8:12","id==='log-mini-dash'?7:12",1)

          css='''<style id="idol-v240-dashboard-relation-layout">.dashboard-v24-summary{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,.9fr);gap:16px;align-items:stretch;margin-bottom:16px}.dashboard-v24-summary>.dashboard-v23-card{height:100%;margin:0;position:relative;transform:none;grid-area:auto!important}.dashboard-v24-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);grid-template-areas:"schedule alert" "logs change";gap:16px;align-items:stretch}.dashboard-v24-main>.dashboard-v23-card{width:100%;min-width:0;height:100%;margin:0;transform:none;display:flex;flex-direction:column}.dashboard-v24-main .dashboard-schedule-card{grid-area:schedule;min-height:310px}.dashboard-v24-main .dashboard-alert-card{grid-area:alert;min-height:310px}.dashboard-v24-main .dashboard-log-card{grid-area:logs;height:360px;min-height:360px;max-height:360px}.dashboard-v24-main .dashboard-change-card{grid-area:change;height:360px;min-height:360px;max-height:360px}.dashboard-v24-main .dashboard-schedule-list{flex:1 1 auto;min-height:120px}.dashboard-v24-main .dashboard-alerts{flex:1 1 auto;max-height:220px;overflow:auto}.dashboard-v24-main .dashboard-log-feed{flex:1 1 auto;max-height:none!important;overflow:auto!important;min-height:0}.dashboard-v24-main .dashboard-relation-changes{flex:1 1 auto;max-height:245px;overflow:auto}.dashboard-v24-main .dashboard-empty-state{padding:28px 20px;min-height:128px}.dashboard-v24-main .dashboard-empty-state .dashboard-empty-action{margin-top:12px;min-height:38px}.dashboard-v24-main .dashboard-day-actions{margin-top:16px}.dashboard-v24-main .dashboard-day-actions .btn-day{background:linear-gradient(135deg,var(--accent),var(--accent2))!important}.dashboard-v24-main .dashboard-day-actions .btn-day2{background:linear-gradient(135deg,#5d4ab0,#b04a80)!important}.dashboard-v24-main .dashboard-helper{margin-top:10px}.relation-romance-pill,.relation-intimacy-pill{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-height:25px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--text-sub);font-size:.64rem;font-weight:800;white-space:nowrap}.relation-romance-pill.lover{color:#d93f7c}.relation-romance-pill.exLover{color:var(--danger)}.relation-romance-pill.flirting{color:#8f4fc0}.relation-romance-pill.crush{color:#c94e7c}.relation-romance-pill.none{opacity:.72}.pair-detail-state-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px}.ev-pair-summary-head{flex-wrap:wrap}@media(max-width:760px){.dashboard-v24-summary,.dashboard-v24-main{grid-template-columns:1fr;gap:10px}.dashboard-v24-summary{margin-bottom:10px}.dashboard-v24-main{grid-template-areas:"schedule" "alert" "logs" "change"}.dashboard-v24-main .dashboard-schedule-card,.dashboard-v24-main .dashboard-alert-card,.dashboard-v24-main .dashboard-log-card,.dashboard-v24-main .dashboard-change-card{min-height:0;height:auto;max-height:none}.dashboard-v24-main .dashboard-alerts,.dashboard-v24-main .dashboard-relation-changes{max-height:none;overflow:visible}.dashboard-v24-main .dashboard-log-feed{max-height:230px!important}.dashboard-v24-main .dashboard-empty-state{padding:22px 14px}}@media(max-width:420px){.relation-pair-head{flex-wrap:wrap}}</style>'''
          s=s.replace('</head>',css+'</head>',1)
          s=s.replace('</body>','<!-- idol-v24.0 dashboard-relation build -->\n</body>',1)
          assert '고백 대기' not in s[s.index('function getRelationStatusBadges'):s.index('function getRelationTrend')]
          assert 'dashboard-v24-main' in s and 'getRelationRomanceStatus' in s
          p.write_text(s,encoding='utf-8')
          PY
          node --check <(python3 - <<'PY'
          import re
          s=open('mobile/idol/index.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          )

      - name: Commit v24 page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/idol/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Deploy idol simulator v24 dashboard and relation UI'
          git pull --rebase origin main
          git push origin HEAD:main
