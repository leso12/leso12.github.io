name: Deploy LumiChat Mobile v0.15.36 P1-P4

on:
  push:
    paths:
      - '.deploy/lumichat01536/trigger.txt'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/lumichat01536/part00.txt .deploy/lumichat01536/part01.txt .deploy/lumichat01536/part02.txt > /tmp/lumichat01536.b64
          base64 -d /tmp/lumichat01536.b64 > /tmp/lumichat01536.patch.gz
          gunzip -c /tmp/lumichat01536.patch.gz > /tmp/lumichat01536.patch
          echo '4a3274f9b4de201c37ec58b4d5e96f98c2a106009becabb6b8c670eb06a8d86e  /tmp/lumichat01536.patch' | sha256sum -c -
          git apply --check /tmp/lumichat01536.patch
          git apply /tmp/lumichat01536.patch
      - name: Verify v0.15.36 mobile source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LumiChat v0.15.36 Mobile' mobile/lumichat/index.html
          grep -Fq 'app.js?boot=01536' mobile/lumichat/index.html
          grep -Fq 'lumichat-mobile-v01531' mobile/lumichat/index.html
          grep -Fq "APP_VERSION='0.15.36'" mobile/lumichat/core.js
          grep -Fq 'SCHEMA_VERSION=19' mobile/lumichat/core.js
          grep -Fq 'P3 list & management normalization — v0.15.36' mobile/lumichat/lumi-geometry.css
          grep -Fq 'P4 chat surface & composer — v0.15.36' mobile/lumichat/lumi-geometry.css
          grep -Fq '.chat-page>.composer.mobile-composer-v2' mobile/lumichat/lumi-geometry.css
          grep -Fq 'mobile-character-manager-page' mobile/lumichat/app.js
          grep -Fq 'mobile-composer-v2' mobile/lumichat/app.js
          grep -Fq 'composerMemory' mobile/lumichat/app.js
          grep -Fq 'mobile-manage-row' mobile/lumichat/managers.js
          grep -Fq 'v0.15.36' mobile/lumichat/sw.js
          rm -rf .deploy/lumichat01536
      - name: Commit deployed mobile v0.15.36
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mobile/lumichat .deploy/lumichat01536
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy LumiChat mobile v0.15.36 P1-P4'
          git push
