name: Patch Idol Mobile v21.3 Relationship UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/idol-mobile-v213-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: idol-mobile-v213-hotfix
  cancel-in-progress: true

jobs:
  patch-v213:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch deployed single HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('mobile/idol/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('content="2.1.2"','content="2.1.3"',1)
          s=s.replace('idol-modal-critical-v212','idol-modal-critical-v213')

          tier_fn="""function getRelationDisplayTier(rel) {\n  const a = clampAffection(Number(rel && rel.affection) || 0);\n  return RELATION_DISPLAY_TIERS.find(t => a >= t.min && a <= t.max) || RELATION_DISPLAY_TIERS[3];\n}\n"""
          primary_fn=tier_fn+"""\n// v21.3: UI 대표 관계는 공식 관계 상태를 우선한다.\nfunction getRelationPrimaryDisplay(rel, settings) {\n  if (isLover(rel)) return { id:'lover', icon:'💗', label:'연인', short:'연인', official:true };\n  if (isExLover(rel)) return { id:'exLover', icon:'💔', label:'전 연인', short:'전 연인', official:true };\n  return { ...getRelationDisplayTier(rel), official:false };\n}\n"""
          if 'function getRelationPrimaryDisplay' not in s:
              assert tier_fn in s, 'tier function missing'
              s=s.replace(tier_fn,primary_fn,1)
          s=s.replace('getRelationDisplayTier, getRelationStatusBadges, getRelationTrend, RELATION_DISPLAY_TIERS,','getRelationDisplayTier, getRelationPrimaryDisplay, getRelationStatusBadges, getRelationTrend, RELATION_DISPLAY_TIERS,',1)

          meter_re=re.compile(r"function relationMeterHtml\(rel, compact=false\)\{.*?\n\}\nfunction relationRecentDelta",re.S)
          meter_new="""function relationMeterHtml(rel, compact=false){\n  const RM=window.RelationsModule;\n  const primary=RM.getRelationPrimaryDisplay(rel,APP.state&&APP.state.settings);\n  if(primary.official) return '';\n  const tier=RM.getRelationDisplayTier(rel), tiers=RM.RELATION_DISPLAY_TIERS||[];\n  const active=Math.max(0,tiers.findIndex(t=>t.id===tier.id));\n  return `<div class=\"relation-tier-wrap${compact?' compact':''}\">\n    <div class=\"relation-tier-track\" aria-label=\"관계 단계 ${escapeAttr(tier.label)}\">${tiers.map((t,i)=>`<span class=\"relation-tier-node ${i===active?'active':i<active?'passed':''}\" title=\"${escapeAttr(t.label)}\"><i>${t.icon}</i>${compact?'':`<b>${escapeHtml(t.short)}</b>`}</span>`).join('')}</div>\n    ${compact?'':`<div class=\"relation-tier-caption\"><strong>${tier.icon} ${escapeHtml(tier.label)}</strong><small>정확한 수치는 상세에서 확인</small></div>`}\n  </div>`;\n}\nfunction relationRecentDelta"""
          s,n=meter_re.subn(meter_new,s,count=1)
          assert n==1,'relationMeterHtml patch failed'

          badge_re=re.compile(r"function relationStatusBadgesHtml\(rel\)\{.*?\n\}",re.S)
          badge_new="""function relationStatusBadgesHtml(rel){\n  const RM=window.RelationsModule;\n  const primary=RM.getRelationPrimaryDisplay(rel,APP.state&&APP.state.settings);\n  const badges=(RM.getRelationStatusBadges(rel,APP.state&&APP.state.settings)||[]).filter(b=>b.id!==primary.id);\n  return badges.length?`<div class=\"relation-status-badges\">${badges.map(b=>`<span class=\"relation-status-badge ${escapeAttr(b.id)}\">${b.icon} ${escapeHtml(b.label)}</span>`).join('')}</div>`:'';\n}"""
          s,n=badge_re.subn(badge_new,s,count=1)
          assert n==1,'badge patch failed'

          s=s.replace('const tier=RM.getRelationDisplayTier(rel), trend=RM.getRelationTrend(rel,APP.state.day,7);','const tier=RM.getRelationPrimaryDisplay(rel,APP.state&&APP.state.settings), trend=RM.getRelationTrend(rel,APP.state.day,7);',1)
          s=s.replace('const rel=RM.ensureRelation(s,idA,idB), tier=RM.getRelationDisplayTier(rel), trend=RM.getRelationTrend(rel,s.day,7);','const rel=RM.ensureRelation(s,idA,idB), tier=RM.getRelationPrimaryDisplay(rel,s.settings), trend=RM.getRelationTrend(rel,s.day,7);',1)
          s=s.replace('const tier=RM.getRelationDisplayTier(rel),trend=RM.getRelationTrend(rel,s.day,7);','const tier=RM.getRelationPrimaryDisplay(rel,s.settings),trend=RM.getRelationTrend(rel,s.day,7);',1)

          css="""\n<style id=\"idol-v213-button-center\">\nbutton { text-align:center !important; }\n.btn { justify-content:center !important; text-align:center !important; }\n.btn-sm,.ev-item,.tab-btn,.text-link-btn,.header-icon-btn,.activity-picker-btn,.activity-btn,.schedule-remove-one,.relation-detail-btn,.tab-save-btn,.btn-day,.btn-day2 { text-align:center !important; }\nbutton[style*=\"display:flex\"],button[style*=\"display: flex\"] { justify-content:center !important; }\n</style>\n"""
          if 'idol-v213-button-center' not in s:
              s=s.replace('</head>',css+'</head>',1)
          s=s.replace('// v21.2 modal-alignment-build','// v21.3 relation-primary-and-button-center-build')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'idol-sim-version" content="2.1.3' mobile/idol/index.html
          grep -q 'function getRelationPrimaryDisplay' mobile/idol/index.html
          grep -q "if(primary.official) return ''" mobile/idol/index.html
          grep -q 'idol-v213-button-center' mobile/idol/index.html
          grep -q 'justify-content:center !important' mobile/idol/index.html
      - name: Commit patched page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/idol/index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
          else
            git commit -m 'Deploy idol mobile v21.3 relationship UI fix'
            git push
          fi
