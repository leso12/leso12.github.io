name: Deploy LumiChat Mobile v0.15.33

on:
  push:
    paths:
      - '.deploy/lumichat-01533-trigger.txt'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy validated LumiChat v0.15.33 mobile bundle
        shell: bash
        run: |
          set -euo pipefail
          ZIP=.deploy/lumichat_v01533.zip
          test -f "$ZIP"
          rm -rf /tmp/lumichat-01533
          mkdir -p /tmp/lumichat-01533
          unzip -q "$ZIP" -d /tmp/lumichat-01533
          SRC=/tmp/lumichat-01533/lumichat_deploy_01533
          test -f "$SRC/index.html"
          test -f "$SRC/app.js"
          test -f "$SRC/core.js"
          test -f "$SRC/lumi-theme.css"
          test -f "$SRC/lumi-geometry.css"
          rm -rf mobile/lumichat
          mkdir -p mobile/lumichat
          cp -a "$SRC"/. mobile/lumichat/
          rm -f .deploy/lumichat_v01533.zip .deploy/lumichat-01533-trigger.txt
      - name: Commit deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mobile/lumichat .deploy
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy LumiChat mobile v0.15.33 geometry normalization'
          git push
