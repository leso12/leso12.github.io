name: Idol Mobile v22 QA Artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/idol-mobile-v220-qa-artifact.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: idol-mobile-v22-page
          path: mobile/idol/index.html
          if-no-files-found: error
