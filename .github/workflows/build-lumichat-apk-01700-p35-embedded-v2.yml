name: Build LumiChat Android APK v0.17.0 P35 Embedded v2

on:
  push:
    paths:
      - '.deploy/lumichat-apk-01700-p35-embedded-v2-trigger.txt'

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify exact P35 payload
        shell: bash
        run: |
          set -euo pipefail
          D='.deploy/lumichat_p35_clean_20260907'
          test -d "$D"
          for i in {00..15}; do test -s "$D/part$i"; done
          cat "$D"/part{00..15} | tr -d '[:space:]' > /tmp/p35.b64
          base64 -d /tmp/p35.b64 > /tmp/mobile-pwa.tar.xz
          echo '02d793b28ffd799d5cd9579dc07f603020d107ae06210d533d4b237713c02798  /tmp/mobile-pwa.tar.xz' | sha256sum -c -
          xz -t /tmp/mobile-pwa.tar.xz
          rm -rf /tmp/p35
          mkdir -p /tmp/p35
          tar -xJf /tmp/mobile-pwa.tar.xz -C /tmp/p35
          test -f /tmp/p35/mobile-pwa/index.html
          test -f /tmp/p35/mobile-pwa/app.js
          test -f /tmp/p35/mobile-pwa/core.js
          test -f /tmp/p35/mobile-pwa/p35-style-scope-ui.css
          grep -Fq 'LumiChat v0.17.0 P35 Style Scope UI Cleanup Mobile' /tmp/p35/mobile-pwa/index.html
          grep -Fq 'p35-style-scope-ui.css?v=01700p35' /tmp/p35/mobile-pwa/index.html
          grep -Fq "APP_VERSION='0.17.0'" /tmp/p35/mobile-pwa/core.js

      - name: Generate embedded Android project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lumichat-p35-android-v2"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/app/src/main/assets" "$ROOT/app/src/main/java/io/github/leso12/lumichat" "$ROOT/app/src/main/res/values"
          cp -a /tmp/p35/mobile-pwa/. "$ROOT/app/src/main/assets/"

          cat > "$ROOT/app/src/main/assets/sw.js" <<'EOF'
          self.addEventListener('install', event => { self.skipWaiting(); });
          self.addEventListener('activate', event => { event.waitUntil(self.clients.claim()); });
          EOF

          cat > "$ROOT/app/src/main/assets/p35-bootstrap.html" <<'EOF'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#0b0c0e">
            <style>
              html,body{margin:0;height:100%;background:#0b0c0e;color:#e8e8e8;font-family:system-ui,sans-serif}
              body{display:grid;place-items:center}.box{text-align:center}.dot{width:28px;height:28px;margin:0 auto 14px;border:3px solid #3b3d42;border-top-color:#e1b955;border-radius:50%;animation:s .7s linear infinite}
              @keyframes s{to{transform:rotate(360deg)}} small{color:#9a9a9a}
            </style>
          </head>
          <body>
            <div class="box"><div class="dot"></div><b>LumiChat P35 여는 중…</b><br><small>APK에 포함된 P35를 불러오고 있어요.</small></div>
            <script>
              (async()=>{
                try{
                  if('serviceWorker' in navigator){
                    const regs=await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(r=>r.unregister()));
                  }
                  if('caches' in window){
                    const keys=await caches.keys();
                    await Promise.all(keys.filter(k=>String(k).startsWith('lumichat-mobile-')).map(k=>caches.delete(k)));
                  }
                }catch(e){console.warn(e)}
                location.replace('https://leso12.github.io/mobile/lumichat/index.html?embedded=01700p35v2');
              })();
            </script>
          </body>
          </html>
          EOF

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='LumiChatP35Embedded'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'io.github.leso12.lumichat'
              compileSdk 35
              defaultConfig {
                  applicationId 'io.github.leso12.lumichat'
                  minSdk 26
                  targetSdk 35
                  versionCode 1700352
                  versionName '0.17.0-P35-Embedded-v2'
              }
              buildTypes { debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF

          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B0C0E</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="LumiChat P35" android:theme="@style/AppTheme" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/java/io/github/leso12/lumichat/MainActivity.java" <<'EOF'
          package io.github.leso12.lumichat;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final String DOMAIN = "leso12.github.io";
              private static final String BOOT = "https://leso12.github.io/__lumichat_p35__/p35-bootstrap.html";
              private static final int FILE_CHOOSER = 1700352;
              private WebView webView;
              private ProgressBar progress;
              private ValueCallback<Uri[]> fileCallback;
              private WebViewAssetLoader assetLoader;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(11,12,14));
                  getWindow().setNavigationBarColor(Color.BLACK);

                  assetLoader = new WebViewAssetLoader.Builder()
                      .setDomain(DOMAIN)
                      .addPathHandler("/mobile/lumichat/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .addPathHandler("/__lumichat_p35__/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  root.addView(webView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(progress, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 5));
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(false);
                  s.setUseWideViewPort(false);
                  s.setSupportZoom(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUserAgentString(s.getUserAgentString() + " LumiChatAndroid/0.17.0-P35-Embedded-v2");
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  WebView.setWebContentsDebuggingEnabled(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          WebResourceResponse local = assetLoader.shouldInterceptRequest(request.getUrl());
                          return local != null ? local : super.shouldInterceptRequest(view, request);
                      }
                      @SuppressWarnings("deprecation")
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                          WebResourceResponse local = assetLoader.shouldInterceptRequest(Uri.parse(url));
                          return local != null ? local : super.shouldInterceptRequest(view, url);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) { return route(request.getUrl()); }
                      @SuppressWarnings("deprecation")
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) { return route(Uri.parse(url)); }
                      @Override public void onPageFinished(WebView view, String url) { progress.setVisibility(View.GONE); }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                          progress.setVisibility(newProgress >= 100 ? View.GONE : View.VISIBLE);
                      }
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          Intent intent;
                          try { intent = params.createIntent(); }
                          catch (Exception e) { intent = new Intent(Intent.ACTION_OPEN_DOCUMENT).setType("*/*").addCategory(Intent.CATEGORY_OPENABLE); }
                          try { startActivityForResult(intent, FILE_CHOOSER); }
                          catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              Toast.makeText(MainActivity.this, "파일 선택기를 열 수 없어요.", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setDownloadListener((url, ua, cd, mime, len) -> {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); }
                      catch (Exception e) { Toast.makeText(this, "다운로드 링크를 열 수 없어요.", Toast.LENGTH_SHORT).show(); }
                  });

                  if (savedInstanceState == null) webView.loadUrl(BOOT); else webView.restoreState(savedInstanceState);
              }

              private boolean route(Uri uri) {
                  String scheme = uri.getScheme();
                  String host = uri.getHost();
                  if (("https".equalsIgnoreCase(scheme) || "http".equalsIgnoreCase(scheme)) && DOMAIN.equalsIgnoreCase(host)) return false;
                  if ("about".equalsIgnoreCase(scheme)) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                  catch (Exception e) { Toast.makeText(this, "외부 링크를 열 수 없어요.", Toast.LENGTH_SHORT).show(); }
                  return true;
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER || fileCallback == null) return;
                  fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                  fileCallback = null;
              }

              @Override protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build and verify embedded P35 APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lumichat-p35-android-v2"
          cd "$ROOT"
          gradle --no-daemon :app:assembleDebug
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"

          unzip -Z1 "$APK" > /tmp/apk-files.txt
          grep -Fx 'AndroidManifest.xml' /tmp/apk-files.txt
          grep -Fx 'classes.dex' /tmp/apk-files.txt
          grep -Fx 'assets/index.html' /tmp/apk-files.txt
          grep -Fx 'assets/core.js' /tmp/apk-files.txt
          grep -Fx 'assets/p35-style-scope-ui.css' /tmp/apk-files.txt
          grep -Fx 'assets/p35-bootstrap.html' /tmp/apk-files.txt

          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          unzip -p "$APK" assets/core.js > /tmp/apk-core.js
          grep -Fq 'LumiChat v0.17.0 P35 Style Scope UI Cleanup Mobile' /tmp/apk-index.html
          grep -Fq 'p35-style-scope-ui.css?v=01700p35' /tmp/apk-index.html
          grep -Fq "APP_VERSION='0.17.0'" /tmp/apk-core.js

          mkdir -p "$GITHUB_WORKSPACE/mobile/lumichat/downloads"
          OUT="$GITHUB_WORKSPACE/mobile/lumichat/downloads/LumiChat-v0.17.0-P35-Embedded.apk"
          cp "$APK" "$OUT"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$OUT" > .deploy/lumichat-apk-01700-p35-embedded.sha256
          rm -f .deploy/lumichat-apk-01700-p35-embedded-v2-trigger.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LumiChat-v0.17.0-P35-Embedded-APK
          path: mobile/lumichat/downloads/LumiChat-v0.17.0-P35-Embedded.apk
          if-no-files-found: error

      - name: Commit APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lumichat/downloads/LumiChat-v0.17.0-P35-Embedded.apk .deploy/lumichat-apk-01700-p35-embedded.sha256 .deploy/lumichat-apk-01700-p35-embedded-v2-trigger.txt
          git commit -m 'Build embedded LumiChat Android APK v0.17.0 P35'
          git push
