name: Deploy LumiChat Mobile v0.15.30 Patch

on:
  push:
    paths:
      - '.deploy/lumichat-patch-01530-trigger.txt'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated v0.15.30 mobile patch
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/lumichat_patch_01530/part* | base64 -d > /tmp/lumichat-mobile-patch.zip
          rm -rf /tmp/lumichat-patch
          mkdir -p /tmp/lumichat-patch
          unzip -q /tmp/lumichat-mobile-patch.zip -d /tmp/lumichat-patch
          SRC=/tmp/lumichat-patch/lumichat_patch_01530
          for f in app.js chat.js core.js widgets.js index.html sw.js v01530-ui-fixes.css; do
            test -f "$SRC/$f"
            cp "$SRC/$f" "mobile/lumichat/$f"
          done
          rm -rf .deploy/lumichat_patch_01530 .deploy/lumichat-patch-01530-trigger.txt
      - name: Commit deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mobile/lumichat .deploy
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy LumiChat mobile v0.15.30 UI stability'
          git push
