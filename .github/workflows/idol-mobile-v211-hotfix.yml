name: Patch Idol Mobile v21.1 Modal UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/idol-mobile-v211-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: idol-mobile-v211-hotfix
  cancel-in-progress: true

jobs:
  patch-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch direct single-file mobile app
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/idol/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('idol-sim-version" content="2.1.0"','idol-sim-version" content="2.1.1"',1)

          old='''/* ── v21 공통 확인/알림 모달: 화면·내용·버튼 중앙 정렬 ── */
          .modal-box-confirm { max-width:600px; text-align:center; }
          .modal-box-confirm .popup-msg { text-align:center; font-size:.92rem; line-height:1.65; }
          .modal-box-confirm .modal-actions { justify-content:center; align-items:center; position:static; background:none; margin-left:0; margin-right:0; padding:0; }
          .modal-box-confirm .modal-actions .btn,
          .modal-box-confirm .modal-actions .btn-sm { flex:0 0 auto; min-width:88px; min-height:44px; }
          @media (max-width: 640px) {
            .modal-box-confirm { width:min(100%,520px); padding:20px 16px; }
            .modal-box-confirm .modal-actions { flex-direction:row; flex-wrap:wrap; }
            .modal-box-confirm .modal-actions .btn,
            .modal-box-confirm .modal-actions .btn-sm { flex:0 1 120px; }
          }
          '''
          new='''/* ── v21.1 모달 레이아웃 핫픽스 ──
             확인/알림은 짧고 중앙 정렬, 진행 요약은 읽기 폭을 제한하고 로그만 좌측 정렬한다. */
          .modal-box-confirm {
            width:min(calc(100vw - 32px),420px);
            max-width:420px;
            padding:24px 22px;
            text-align:center;
          }
          .modal-box-confirm .popup-msg { text-align:center; font-size:.92rem; line-height:1.65; }
          .modal-box-confirm .modal-actions,
          .modal-box-summary .modal-actions {
            display:flex;
            width:100%;
            justify-content:center;
            align-items:center;
            gap:10px;
            position:static;
            background:none;
            margin:18px 0 0;
            padding:0;
            flex-wrap:nowrap;
          }
          .modal-box-confirm .modal-actions .btn,
          .modal-box-confirm .modal-actions .btn-sm,
          .modal-box-summary .modal-actions .btn,
          .modal-box-summary .modal-actions .btn-sm {
            flex:0 0 110px;
            width:110px;
            min-width:110px;
            min-height:44px;
          }
          .modal-box-summary {
            width:min(calc(100vw - 32px),540px);
            max-width:540px;
            padding:22px;
          }
          .modal-box-summary > h3 { text-align:center; }
          .modal-box-summary > .note { text-align:center; }
          .modal-box-summary .summary-list,
          .modal-box-summary .summary-list > div { text-align:left; }
          @media (max-width: 640px) {
            .modal-box-confirm {
              width:min(calc(100vw - 24px),380px);
              padding:20px 16px;
            }
            .modal-box-summary {
              width:min(calc(100vw - 20px),500px);
              padding:18px 14px;
            }
            .modal-box-confirm .modal-actions,
            .modal-box-summary .modal-actions { flex-direction:row; flex-wrap:nowrap; }
            .modal-box-confirm .modal-actions .btn,
            .modal-box-confirm .modal-actions .btn-sm,
            .modal-box-summary .modal-actions .btn,
            .modal-box-summary .modal-actions .btn-sm {
              flex:0 1 108px;
              width:108px;
              min-width:0;
            }
          }
          '''
          if old not in s:
              raise SystemExit('v21 modal CSS block not found')
          s=s.replace(old,new,1)

          old_call="    <div class=\"modal-actions\"><button class=\"btn\" onclick=\"closeModal()\">확인</button></div>`,true,'modal-box-confirm');\n}\n\n// ─── 다음날 ───"
          new_call="    <div class=\"modal-actions\"><button class=\"btn\" onclick=\"closeModal()\">확인</button></div>`,true,'modal-box-summary');\n}\n\n// ─── 다음날 ───"
          if old_call not in s:
              raise SystemExit('progress summary modal call not found')
          s=s.replace(old_call,new_call,1)

          assert 'idol-sim-version" content="2.1.1"' in s
          assert 'max-width:420px' in s
          assert '.modal-box-summary .summary-list' in s
          assert "true,'modal-box-summary')" in s
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit v21.1 mobile hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/idol/index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
          else
            git commit -m 'Hotfix idol mobile v21.1 modal layout and log alignment'
            git push
          fi
