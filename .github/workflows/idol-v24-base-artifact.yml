name: Idol v24 Base Artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/idol-v24-base-artifact.yml'

permissions:
  contents: read

actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current idol page
        uses: actions/upload-artifact@v4
        with:
          name: idol-v24-base
          path: mobile/idol/index.html
          if-no-files-found: error
