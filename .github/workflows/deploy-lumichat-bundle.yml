name: Deploy LumiChat Mobile Bundle

on:
  push:
    paths:
      - '.deploy/lumichat-trigger.txt'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild LumiChat mobile bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/lumichat_v01529/part* | base64 -d > /tmp/lumichat-mobile.zip
          rm -rf /tmp/lumichat-unpack
          mkdir -p /tmp/lumichat-unpack
          unzip -q /tmp/lumichat-mobile.zip -d /tmp/lumichat-unpack
          test -f /tmp/lumichat-unpack/lumichat_deploy_01529/index.html
          rm -rf mobile/lumichat
          mkdir -p mobile/lumichat
          cp -a /tmp/lumichat-unpack/lumichat_deploy_01529/. mobile/lumichat/
          rm -rf .deploy/lumichat_v01529 .deploy/lumichat-trigger.txt
      - name: Commit deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mobile/lumichat .deploy
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy LumiChat mobile v0.15.29'
          git push