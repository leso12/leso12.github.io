name: Build Webtoon Android APK

on:
  push:
    branches: [ "webtoon-android-v1" ]
    paths:
      - "webtoon_android/**"
      - ".github/workflows/build-webtoon-apk.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and capture log
        id: build
        continue-on-error: true
        working-directory: webtoon_android
        run: |
          mkdir -p build-output
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output/build.log

      - name: Export installable APK
        if: always()
        run: |
          mkdir -p webtoon_android/build-output
          APK="webtoon_android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" webtoon_android/build-output/WebtoonViewer_Android_v1.1_ADFREE.apk
            sha256sum webtoon_android/build-output/WebtoonViewer_Android_v1.1_ADFREE.apk > webtoon_android/build-output/WebtoonViewer_Android_v1.1_ADFREE.apk.sha256
          fi

      - name: Commit build result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webtoon_android/build-output
          git diff --cached --quiet && exit 0
          git commit -m "webtoon android: publish v1.1 ad-free APK [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
