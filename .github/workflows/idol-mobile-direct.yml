name: Build Idol Mobile Direct Page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/idol-mobile-direct.yml'
      - 'mobile/idol/part*.txt'

permissions:
  contents: write

concurrency:
  group: idol-mobile-direct
  cancel-in-progress: true

jobs:
  build-direct-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct single-file mobile app
        shell: bash
        run: |
          set -euo pipefail
          cat \
            mobile/idol/part001.txt \
            mobile/idol/part001b.txt \
            mobile/idol/part002.txt \
            mobile/idol/part003.txt \
            mobile/idol/part004.txt \
            mobile/idol/part005.txt \
            mobile/idol/part006.txt \
            mobile/idol/part007.txt \
            mobile/idol/part007b.txt \
            mobile/idol/part008.txt \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            | gzip --decompress \
            > mobile/idol/index.html

          test -s mobile/idol/index.html
          grep -q 'window.IDOL_INLINE_BUILD=true' mobile/idol/index.html
          grep -qi '<html' mobile/idol/index.html
          grep -q 'idol-sim-version" content="2.1.0' mobile/idol/index.html

          ACTUAL="$(sha256sum mobile/idol/index.html | awk '{print $1}')"
          EXPECTED='c7a5df5e3ddd8a7e8fdb5142443e18b59609042c6345ead0fc0ddd0cfc7439d1'
          echo "direct page sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit direct page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/idol/index.html
          if git diff --cached --quiet; then
            echo 'No change needed.'
          else
            git commit -m 'Deploy idol mobile direct single-file v21'
            git push
          fi
