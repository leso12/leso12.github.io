name: TaskNote v0.8.6 Final APK

on:
  push:
    branches:
      - tasknote-build-v0.8.6-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Reconstruct patched v0.8.6 source
        shell: bash
        run: |
          cat tasknote-source/part*.b64 > /tmp/tasknote.b64
          base64 -d /tmp/tasknote.b64 > /tmp/tasknote.zip
          unzip -t /tmp/tasknote.zip
          unzip -q /tmp/tasknote.zip -d "$GITHUB_WORKSPACE"

      - name: Verify terminology and version
        shell: bash
        run: |
          cd TaskNote_Android_v0.8.6
          grep -q 'versionCode = 86' app/build.gradle.kts
          grep -q 'versionName = "0.8.6"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q '빠르게 추가' app/src/main/java/com/tasknote/mobile/MainActivity.java
          if grep -R -n -E '빠른 메모|메모 추가|할 일 추가|일정 추가|프로젝트 추가' app/src/main; then
            echo 'Forbidden legacy terminology remains.' >&2
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd TaskNote_Android_v0.8.6
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f TaskNote_Android_v0.8.6/app/build/outputs/apk/debug/app-debug.apk
          unzip -t TaskNote_Android_v0.8.6/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          cp TaskNote_Android_v0.8.6/app/build/outputs/apk/debug/app-debug.apk TaskNote_v0.8.6.apk
          file TaskNote_v0.8.6.apk
          sha256sum TaskNote_v0.8.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskNote_v0.8.6_FINAL_APK
          path: TaskNote_v0.8.6.apk
          if-no-files-found: error
