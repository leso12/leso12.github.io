name: Build LumiChat P36 Local APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.deploy/lumichat_p36_android_20260908/trigger.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore verified P36 Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lumichat-p36
          base64 -d .deploy/lumichat_p36_android_20260908/source.b64 > /tmp/LumiChat_P36_android_source.zip
          echo 'd64f6e1a3c447ce0f8668ec9ca6e3ec2054166b2173627990ab9e8ed16292ca9  /tmp/LumiChat_P36_android_source.zip' | sha256sum -c -
          unzip -q /tmp/LumiChat_P36_android_source.zip -d /tmp/lumichat-p36
          test -f /tmp/lumichat-p36/app/build.gradle
          test -f /tmp/lumichat-p36/app/src/main/assets/lumichat/index.html
          ! grep -R -F 'leso12.github.io/mobile/lumichat' /tmp/lumichat-p36

      - name: Build debug APK
        shell: bash
        working-directory: /tmp/lumichat-p36
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify local P36 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/lumichat-p36/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf /tmp/p36-apk-check
          mkdir -p /tmp/p36-apk-check
          unzip -q "$APK" -d /tmp/p36-apk-check
          test -f /tmp/p36-apk-check/assets/lumichat/index.html
          test -f /tmp/p36-apk-check/assets/lumichat/lumichat-mobile.css
          test -f /tmp/p36-apk-check/assets/lumichat/app.js
          test -f /tmp/p36-apk-check/assets/lumichat/core.js
          test -f /tmp/p36-apk-check/assets/lumichat/chat.js
          grep -F 'v0.18.0 P36 Stability Core Mobile' /tmp/p36-apk-check/assets/lumichat/index.html
          ! grep -R -F 'leso12.github.io/mobile/lumichat' /tmp/p36-apk-check/assets/lumichat
          mkdir -p /tmp/p36-output
          cp "$APK" /tmp/p36-output/LumiChat-v0.18.0-P36-StabilityCore-Local.apk
          sha256sum /tmp/p36-output/LumiChat-v0.18.0-P36-StabilityCore-Local.apk | tee /tmp/p36-output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiChat-v0.18.0-P36-StabilityCore-Local
          path: /tmp/p36-output/*
          if-no-files-found: error
          retention-days: 14
