name: Deploy LumiChat Mobile P35

on:
  push:
    branches: [main]
    paths:
      - '.deploy/lumichat-p35-trigger.txt'

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate LumiChat P35 mobile bundle
        shell: bash
        run: |
          set -euo pipefail
          PART_DIR='.deploy/lumichat_p35_xz'
          test -d "$PART_DIR"
          test -n "$(find "$PART_DIR" -maxdepth 1 -type f -name 'part*' -print -quit)"

          cat "$PART_DIR"/part* | tr -d '\r\n ' | base64 -d > /tmp/lumichat-p35-stage0
          rm -rf /tmp/lumichat-p35-unpack
          mkdir -p /tmp/lumichat-p35-unpack

          CURRENT=/tmp/lumichat-p35-stage0
          for DEPTH in 1 2 3 4 5 6; do
            NEXT="/tmp/lumichat-p35-stage${DEPTH}"
            if xz -t "$CURRENT" >/dev/null 2>&1; then
              echo "decode layer ${DEPTH}: xz"
              xz -dc "$CURRENT" > "$NEXT"
              CURRENT="$NEXT"
              continue
            fi
            if gzip -t "$CURRENT" >/dev/null 2>&1; then
              echo "decode layer ${DEPTH}: gzip"
              gzip -dc "$CURRENT" > "$NEXT"
              CURRENT="$NEXT"
              continue
            fi
            if bzip2 -t "$CURRENT" >/dev/null 2>&1; then
              echo "decode layer ${DEPTH}: bzip2"
              bzip2 -dc "$CURRENT" > "$NEXT"
              CURRENT="$NEXT"
              continue
            fi
            if LC_ALL=C grep -Eq '^[A-Za-z0-9+/=[:space:]]+$' "$CURRENT" && base64 -d "$CURRENT" > "$NEXT" 2>/dev/null && [ -s "$NEXT" ]; then
              echo "decode layer ${DEPTH}: base64"
              CURRENT="$NEXT"
              continue
            fi
            break
          done

          echo "final payload: $(file -b "$CURRENT")"
          if tar -tf "$CURRENT" >/dev/null 2>&1; then
            tar -xf "$CURRENT" -C /tmp/lumichat-p35-unpack
          elif unzip -tq "$CURRENT" >/dev/null 2>&1; then
            unzip -q "$CURRENT" -d /tmp/lumichat-p35-unpack
          elif command -v cpio >/dev/null 2>&1 && cpio -it < "$CURRENT" >/dev/null 2>&1; then
            (cd /tmp/lumichat-p35-unpack && cpio -idmu < "$CURRENT")
          else
            echo 'Unable to identify the final P35 archive payload.' >&2
            echo 'First 64 bytes:' >&2
            xxd -l 64 "$CURRENT" >&2 || true
            exit 1
          fi

          INDEX="$(find /tmp/lumichat-p35-unpack -type f -path '*/mobile-pwa/index.html' -print -quit)"
          if [ -z "$INDEX" ]; then
            INDEX="$(find /tmp/lumichat-p35-unpack -type f -name index.html -exec grep -l '0.17.0' {} \; | head -n 1)"
          fi
          test -n "$INDEX"
          SRC="$(dirname "$INDEX")"

          grep -q '0.17.0' "$SRC/index.html"
          test -f "$SRC/app.js"
          test -f "$SRC/core.js"
          test -f "$SRC/styles.css"
          test -f "$SRC/p35-style-scope-ui.css"
          test -f "$SRC/sw.js"

          rm -rf mobile/lumichat
          mkdir -p mobile/lumichat
          cp -a "$SRC"/. mobile/lumichat/

          grep -q '0.17.0' mobile/lumichat/index.html
          grep -q 'p35-style-scope-ui.css' mobile/lumichat/index.html

          rm -rf "$PART_DIR" .deploy/lumichat-p35-trigger.txt

      - name: Commit deployed mobile site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mobile/lumichat .deploy
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy LumiChat mobile v0.17.0 P35'
          git push
