<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7b6df2" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>개발 서재</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4fb;color:#2d2940;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:0 auto;padding:18px 12px 80px}.top{background:linear-gradient(135deg,#7968ec,#9a78f2);color:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 34px #7665da2d}.top h1{margin:0 0 6px;font-size:25px}.top p{margin:0;opacity:.9;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#ffffff1b;border:1px solid #ffffff2f;border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px}.syncrow{display:flex;gap:8px;align-items:center;margin:10px 0}.status{flex:1;padding:10px 12px;background:#fff;border:1px solid #e8e4f1;border-radius:14px;font-size:12px;color:#726a88}.status.bad{color:#a63a46;background:#fff7f8;border-color:#f2cbd0}.status.warn{color:#88640c;background:#fffaf0;border-color:#efe0b5}.refresh{border:1px solid #e3def2;background:#fff;color:#5e54a6;border-radius:14px;padding:10px 12px;min-width:48px;cursor:pointer}.search{position:sticky;top:0;z-index:5;padding:12px 0 8px;background:linear-gradient(#f6f4fb 80%,transparent)}.search input{width:100%;border:1px solid #e2deef;background:white;border-radius:16px;padding:13px 15px;font:inherit;outline:none}.group{margin-top:18px}.gtitle{display:flex;align-items:center;gap:10px;padding:8px 4px}.gtitle>span{font-size:26px}.gtitle h2{font-size:18px;margin:0}.gtitle small{font-size:11px;color:#8c86a2}.project{background:white;border:1px solid #e8e4f1;border-radius:18px;margin:9px 0;overflow:hidden}.project summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}.project summary::-webkit-details-marker{display:none}.picon{width:42px;height:42px;border-radius:13px;background:#f1eefb;display:grid;place-items:center;font-size:22px}.pmain{flex:1;min-width:0}.pmain b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmain small{display:block;color:#918aa8;font-size:11px;margin-top:4px}.arrow{color:#8a82a3;font-size:17px}.project[open] .arrow{transform:rotate(180deg)}.content{border-top:1px solid #f0edf5;padding:14px}.versions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}.chip{font-size:10px;padding:5px 8px;border-radius:999px;background:#ede9ff;color:#6353c8}.now{background:#f7f5ff;border:1px solid #e7e0ff;border-radius:15px;padding:12px;margin-bottom:10px}.now span{font-size:11px;font-weight:700;color:#705fd0}.now p{margin:6px 0 0;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid section{background:#faf9fc;border-radius:14px;padding:11px}.grid h3{margin:0 0 7px;font-size:12px}.grid ul{margin:0;padding-left:17px}.grid li{font-size:11px;line-height:1.55;margin:4px 0}.muted{color:#aaa3b8}.foot{text-align:center;color:#9b95aa;font-size:10px;margin-top:26px;line-height:1.6}.empty{display:none;text-align:center;padding:32px 10px;color:#8f899d}.install{margin-top:10px;font-size:11px;color:#5e54a6;background:#fff;border:1px solid #e3def2;padding:9px 12px;border-radius:12px;display:inline-block}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{border-radius:20px}.project summary{padding:13px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><h1>📚 개발 서재</h1><p id="updated">읽기 전용 · 불러오는 중…</p><div class="stats"><div class="stat"><b id="sg">-</b><span>분류</span></div><div class="stat"><b id="sp">-</b><span>프로젝트</span></div><div class="stat"><b id="sc">-</b><span>대화 기록</span></div></div></header>
<div class="syncrow"><div id="status" class="status">클라우드 데이터를 불러오는 중…</div><button id="refresh" class="refresh" type="button" title="새로고침">↻</button></div>
<div class="search"><input id="q" type="search" placeholder="프로젝트 · 작업 · 버그 검색" /></div>
<div id="groups"></div><div id="empty" class="empty">검색 결과가 없어요.</div>
<footer class="foot">PC 개발 서재에서 동기화된 내용만 표시합니다.<br />이 페이지에서는 수정하거나 삭제할 수 없어요.<div class="install">브라우저 메뉴 → 홈 화면에 추가하면 앱처럼 사용할 수 있어요.</div></footer>
</main>
<script src="./app.js?v=2.1.1"></script>
</body></html>
